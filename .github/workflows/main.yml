            }

            showToast("Searching LRCLIB...");
            try {
                const searchUrl = `https://lrclib.net/api/search?q=${encodeURIComponent(trackVal + " " + artistVal)}`;
                const res = await fetch(searchUrl);
                if (res.ok) {
                    const list = await res.json();
                    const itemWithSynced = list.find(it => it.hasWordSync) || list.find(it => it.syncedLyrics) || list[0];
                    if (itemWithSynced) {
                        const matchedLyrics = lyricsRecordToLines(itemWithSynced);
                        if (!matchedLyrics.length) {
                            showToast("No usable timed lyrics found.");
