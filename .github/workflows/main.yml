        let pipAnimInterval = null;
        let cachedPipCoverImg = new Image();

        function renderFloatingPipFrame() {
            const canvas = document.getElementById('pipCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            const current = state.playlist[state.currentIndex] || { title: "AuraPulse Player", artist: "Studio Pro Edition", durationSec: 210 };
            const bg = themeCss('--bg-base', '#232730'), card = themeCss('--bg-card', '#2c323d');
            const textHead = themeCss('--text-heading', '#ffffff'), textSub = themeCss('--text-dim', '#9ca3af');
            const coral = themeCss('--accent-coral', '#ff5240');

            ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
            ctx.save(); ctx.beginPath(); ctx.roundRect(10, 10, w - 20, h - 20, 26); ctx.fillStyle = card; ctx.fill(); ctx.restore();

            // Cover
            const artX = 28, artY = 28, artSize = 120;
            ctx.save(); ctx.beginPath(); ctx.roundRect(artX, artY, artSize, artSize, 20); ctx.fillStyle = bg; ctx.fill(); ctx.clip();
            if (cachedPipCoverImg.complete && cachedPipCoverImg.naturalWidth > 0) ctx.drawImage(cachedPipCoverImg, artX, artY, artSize, artSize);
            else { ctx.fillStyle = coral; ctx.font = "bold 44px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("♪", artX + artSize / 2, artY + artSize / 2); }
            ctx.restore();

            // Title / artist / live lyric (text only - the system draws its own play, previous and next buttons)
            const textX = 170;
            ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
            ctx.fillStyle = textHead; ctx.font = "800 22px 'Plus Jakarta Sans', sans-serif";
            ctx.fillText((current.title || "Track").slice(0, 22), textX, 66);
            ctx.fillStyle = textSub; ctx.font = "600 16px 'Plus Jakarta Sans', sans-serif";
            ctx.fillText((current.artist || "AuraPulse").slice(0, 28), textX, 94);

            const curTime = audioElement.currentTime || state.simulatedSec || 0;
            let activeLyric = "AuraPulse Studio Pro";
            if (state.parsedLyrics && state.parsedLyrics.length) {
                for (let i = 0; i < state.parsedLyrics.length; i++) if (curTime >= state.parsedLyrics[i].time) activeLyric = state.parsedLyrics[i].text;
            }
            ctx.fillStyle = coral; ctx.font = "800 15px 'Plus Jakarta Sans', sans-serif";
            ctx.fillText(("♪ " + activeLyric).slice(0, 30), textX, 132);

            // Progress bar along the bottom
            const dur = (audioElement.duration && !isNaN(audioElement.duration)) ? audioElement.duration : (current.durationSec || 200);
            const pct = Math.max(0, Math.min(1, curTime / dur));
            const gx = 28, gy = h - 44, gw = w - 56, gh = 8;
            ctx.beginPath(); ctx.roundRect(gx, gy, gw, gh, 4); ctx.fillStyle = bg; ctx.fill();
            if (pct > 0) { ctx.beginPath(); ctx.roundRect(gx, gy, Math.max(gh, gw * pct), gh, 4); ctx.fillStyle = coral; ctx.fill(); }
        }

        async function toggleFloatingMiniPlayer() {
            const pipVideo = document.getElementById('pipVideo');
            const canvas = document.getElementById('pipCanvas');
            if (!pipVideo || !canvas) return;

            if (document.pictureInPictureElement) {
                await document.exitPictureInPicture();
                state.pipActive = false;
                if (pipAnimInterval) clearInterval(pipAnimInterval);
                showToast("Floating player closed");
                return;
            }

            try {
                const current = state.playlist[state.currentIndex];
                if (current && current.cover) cachedPipCoverImg.src = current.cover;

                renderFloatingPipFrame();
                const stream = canvas.captureStream(15);
                pipVideo.srcObject = stream;
                await pipVideo.play();
                await pipVideo.requestPictureInPicture();

                state.pipActive = true;
                showToast("Floating 3D Mini Player Active! 🚀");

                if (pipAnimInterval) clearInterval(pipAnimInterval);
                pipAnimInterval = setInterval(renderFloatingPipFrame, 200);

                pipVideo.onpause = () => { if (state.pipActive && state.isPlaying && !pipSyncing) pauseAudio(); };
                pipVideo.onplay = () => { if (state.pipActive && !state.isPlaying && !pipSyncing) playAudio(); };
                pipVideo.addEventListener('leavepictureinpicture', () => {
                    state.pipActive = false;
                    if (pipAnimInterval) clearInterval(pipAnimInterval);
                }, { once: true });
            } catch (err) {
                showToast("PiP requires browser permission");
            }
        }

        let simTimer = null;

        function syncPipVideo(playing) {
            const v = document.getElementById('pipVideo');
            if (!state.pipActive || !v) return;
            pipSyncing = true;
            try { if (playing) v.play().catch(() => {}); else v.pause(); } catch (_) {}
            setTimeout(() => { pipSyncing = false; }, 400);
        }
        audioElement.addEventListener('play', () => { syncPipVideo(true); state.isPlaying = true; updatePlaybackStateIcons(); syncMediaPlaybackState(); updateMediaSession(state.playlist[state.currentIndex]); savePlayerSession(true); });
        audioElement.addEventListener('pause', () => { syncPipVideo(false); state.isPlaying = false; updatePlaybackStateIcons(); syncMediaPlaybackState(); savePlayerSession(true); });

        audioElement.addEventListener('timeupdate', () => {
            updateMediaPosition();
            if (!isNaN(audioElement.currentTime)) {
                updateTrackProgress(audioElement.currentTime, audioElement.duration);
                savePlayerSession(false);
            }
        });

        function updateTrackProgress(currentTime, totalDuration) {
            state.simulatedSec = currentTime;
            const dur = (totalDuration && !isNaN(totalDuration) && totalDuration > 0) ? totalDuration : (state.playlist[state.currentIndex]?.durationSec || 1);
            const pct = (state.simulatedSec / dur) * 100;
            
            const seekFill = document.getElementById('studioSeekFill');
            if (seekFill) seekFill.style.width = Math.min(pct, 100) + '%';
            
            const miniFill = document.getElementById('dockedMiniFill');
            if (miniFill) miniFill.style.width = Math.min(pct, 100) + '%';

            const currTime = document.getElementById('labelCurrentTime');
            if (currTime) currTime.textContent = formatSeconds(state.simulatedSec);

            updateLyricsScroll(state.simulatedSec);
        }

        audioElement.addEventListener('loadedmetadata', () => {
            if (!isNaN(audioElement.duration) && audioElement.duration > 0) {
                const song = state.playlist[state.currentIndex];
                if (song) {
                    song.durationSec = Math.floor(audioElement.duration);
                    song.duration = formatSeconds(song.durationSec);
                    document.getElementById('labelDurationTime').textContent = song.duration;
                    saveTrackMeta(song);
                }
            }
        });

        let endedTransitionInProgress = false;
        audioElement.addEventListener('ended', () => {
            if (endedTransitionInProgress) return;
            endedTransitionInProgress = true;
            if (state.sleepEndOfSongActive) {
                pauseAudio();
                state.sleepEndOfSongActive = false;
                document.getElementById('labelSleepTimer').textContent = "Sleep Timer";
                document.getElementById('labelSubTimer').textContent = "Sleep Timer";
                showToast("Sleep Timer: Current song ended 💤");
                endedTransitionInProgress = false;
                return;
            }
            try {
                if (state.isRepeat) playSongByIndex(state.currentIndex);
                else if (state.playlist.length > 1) playNextSong();
                else { state.isPlaying = false; updatePlaybackStateIcons(); syncMediaPlaybackState(); }
            } catch (err) { console.warn('Next-track transition failed', err); state.isPlaying = false; updatePlaybackStateIcons(); syncMediaPlaybackState(); } finally {
                setTimeout(() => { endedTransitionInProgress = false; }, 1200);
            }
        });

        audioElement.addEventListener('error', () => {
            if (!audioElement.src || state.playlist.length < 2) return;
            setTimeout(() => { if (audioElement.error) playNextSong(); }, 800);
        });
        audioElement.addEventListener('stalled', () => { if (state.isPlaying && audioElement.paused && !audioElement.ended) audioElement.play().catch(() => {}); });
        // If the audio has finished but the 'ended' event was swallowed (app in background), move on.
        setInterval(() => {
            if (state.isPlaying && audioElement.ended && !endedTransitionInProgress) audioElement.dispatchEvent(new Event('ended'));
        }, 1500);
        function resumeIfInterrupted() {
            if (state.isPlaying && audioElement.paused && !audioElement.ended && audioElement.src) audioElement.play().catch(() => {});
        }
        document.addEventListener('visibilitychange', () => { setTimeout(resumeIfInterrupted, 150); });
        window.addEventListener('pageshow', () => setTimeout(resumeIfInterrupted, 150));
        window.addEventListener('focus', () => setTimeout(resumeIfInterrupted, 150));

        function navigateTo(targetViewId) {
            closeAllDropdowns();
            if (state.currentView !== targetViewId) state.lastView = state.currentView;
            document.querySelectorAll('.screen-view').forEach(view => view.classList.remove('active-screen'));
            document.getElementById(targetViewId)?.classList.add('active-screen');
            state.currentView = targetViewId;
            savePlayerSession(true);

            const miniPlayer = document.getElementById('dockedMiniPlayer');
            const bottomNav = document.getElementById('bottomNavBar');
            const full = targetViewId === 'viewNowPlaying';
            if (miniPlayer) miniPlayer.style.display = full ? 'none' : 'flex';
            if (bottomNav) bottomNav.style.display = full ? 'none' : 'flex';

            const tabFor = {
                viewHome: 'navItemHome', viewSearch: 'navItemHome',
                viewSongs: 'navItemSongs',
                viewLibrary: 'navItemLibrary', viewPlaylists: 'navItemLibrary', viewAlbums: 'navItemLibrary', viewArtists: 'navItemLibrary',
                viewSettings: 'navItemSettings', viewThemes: 'navItemSettings', viewDsp: 'navItemSettings', viewAbout: 'navItemSettings', viewFolders: 'navItemSettings'
            };
            document.querySelectorAll('.nav-neu-pill-btn').forEach(tab => tab.classList.remove('active'));
            if (tabFor[targetViewId]) document.getElementById(tabFor[targetViewId])?.classList.add('active');

            if (targetViewId === 'viewSearch') renderSearchDiscoveryHub();
            if (targetViewId === 'viewSongs') applySongsLibraryControls();
            if (targetViewId === 'viewLibrary') updateLibraryCounts();
            if (window.lucide) lucide.createIcons();
        }

        function goBackView(fallback) {
            let t = state.lastView;
            if (!t || t === state.currentView || t === 'viewNowPlaying' || !document.getElementById(t)) t = fallback || 'viewHome';
            navigateTo(t);
        }

        /* ---- Songs list scope: all / album / artist / playlist / favorites ---- */
        function getScopedSongs() {
            const sc = state.songsScope;
            if (!sc) return [...state.playlist];
            if (sc.type === 'album') return state.playlist.filter(s => (s.album || 'Unknown Album') === sc.value);
            if (sc.type === 'artist') return state.playlist.filter(s => (s.artist || 'Unknown Artist') === sc.value);
            if (sc.type === 'playlist' || sc.type === 'favorites') {
                const ids = state.customPlaylists[sc.value] || [];
                return state.playlist.filter(s => ids.includes(s.id));
            }
            return [...state.playlist];
        }

        function resetSongsSearchBox() {
            const box = document.getElementById('songsLibrarySearch');
            if (box) box.value = '';
        }

        function openAllSongs() {
            state.songsScope = null;
            resetSongsSearchBox();
            navigateTo('viewSongs');
        }

        function openFavoritesScope() {
            state.songsScope = { type: 'favorites', value: 'Favorites', label: 'Favorites' };
            resetSongsSearchBox();
            navigateTo('viewSongs');
        }

        function clearSongsScope() {
            state.songsScope = null;
            resetSongsSearchBox();
            applySongsLibraryControls();
        }

        function updateSongsScopeChip() {
            const chip = document.getElementById('songsScopeChip');
            if (!chip) return;
            const sc = state.songsScope;
            if (!sc) { chip.style.display = 'none'; chip.replaceChildren(); return; }
            const kinds = { album: 'Album', artist: 'Artist', playlist: 'Playlist', favorites: 'Favorites' };
            chip.replaceChildren();
            const text = document.createElement('span');
            text.className = 'scope-text';
            const kind = document.createElement('span');
            kind.className = 'scope-kind';
            kind.textContent = kinds[sc.type] || '';
            text.appendChild(kind);
            text.appendChild(document.createTextNode(sc.label || ''));
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'neu-btn btn-circle-32';
            btn.title = 'Show all songs';
            btn.onclick = clearSongsScope;
            btn.innerHTML = '<i data-lucide="x" style="width: 14px; height: 14px;"></i>';
            chip.appendChild(text);
            chip.appendChild(btn);
            chip.style.display = 'flex';
            if (window.lucide) lucide.createIcons({ root: chip });
        }

        function updateLibraryCounts() {
            const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
            const albums = new Set(state.playlist.map(s => s.album || 'Unknown Album'));
            const artists = new Set(state.playlist.map(s => s.artist || 'Unknown Artist'));
            const favs = (state.customPlaylists['Favorites'] || []).filter(id => state.playlist.some(s => s.id === id)).length;
            set('libCountSongs', `${state.playlist.length} songs`);
            set('libCountFavs', `${favs} songs`);
            set('libCountPlaylists', `${Object.keys(state.customPlaylists).length} playlists`);
            set('libCountAlbums', `${albums.size} albums`);
            set('libCountArtists', `${artists.size} artists`);
        }

        function _unused_old_nav(targetViewId) {

            const onlineNav = document.getElementById('onlineBottomNav');
            const offlineNav = document.getElementById('offlineBottomNav');

            if (targetViewId === 'viewNowPlaying') {
                if (miniPlayer) miniPlayer.style.display = 'none';
                if (bottomNav) bottomNav.style.display = 'none';
            } else {
                if (miniPlayer) miniPlayer.style.display = 'flex';
                if (bottomNav) bottomNav.style.display = 'flex';
                if (globalCurrentMode === 'online') {
                    if (onlineNav) onlineNav.style.display = 'flex';
                    if (offlineNav) offlineNav.style.display = 'none';
                } else {
                    if (onlineNav) onlineNav.style.display = 'none';
                    if (offlineNav) offlineNav.style.display = 'flex';
                }
            }

            document.querySelectorAll('.nav-neu-pill-btn').forEach(tab => tab.classList.remove('active'));
            if (targetViewId === 'viewHome') document.getElementById('navItemHome')?.classList.add('active');
            if (targetViewId === 'viewSearch') {
                document.getElementById('navItemSearch')?.classList.add('active');
                renderSearchDiscoveryHub();
            }
            if (targetViewId === 'viewSongs') {
                document.getElementById('navItemLibrary')?.classList.add('active');
                if (!state.displayedPlaylist || state.displayedPlaylist.length === 0) {
                    state.displayedPlaylist = [...state.playlist];
                }
                applySongsLibraryControls();
            }
            if (['viewSettings', 'viewThemes', 'viewDsp', 'viewAbout'].includes(targetViewId)) {
                document.getElementById('navItemSettings')?.classList.add('active');
            }
            if (window.lucide) lucide.createIcons();
        }

        function openNowPlayingScreen(event) { navigateTo('viewNowPlaying'); }
        function handleMiniPlayBtnClick(event) { event.stopPropagation(); togglePlayState(); }

        function setupAuraCustomSelect(select) {
            if (!select || select.dataset.auraCustomReady === '1') return;
            select.dataset.auraCustomReady = '1';
            const wrap = document.createElement('div');
            wrap.className = 'aura-select-wrap';
            select.parentNode.insertBefore(wrap, select);
            wrap.appendChild(select);
            select.classList.add('aura-select-native-hidden');
            const trigger = document.createElement('button');
            trigger.type = 'button'; trigger.className = 'aura-select-trigger';
            trigger.setAttribute('aria-haspopup','listbox');
            trigger.innerHTML = '<span class="aura-select-value"></span><i data-lucide="chevron-down"></i>';
            wrap.appendChild(trigger);
            const refresh = () => { const opt = select.options[select.selectedIndex]; trigger.querySelector('.aura-select-value').textContent = opt ? opt.textContent : 'Choose…'; if(window.lucide) lucide.createIcons({root:trigger}); };
            const closeMenu = () => document.getElementById('auraSelectMenuBackdrop')?.remove();
            trigger.addEventListener('click', () => {
                closeMenu();
                const backdrop = document.createElement('div'); backdrop.id='auraSelectMenuBackdrop';
                backdrop.addEventListener('click', e => { if(e.target === backdrop) closeMenu(); });
                const panel = document.createElement('div'); panel.id='auraSelectMenuPanel'; panel.setAttribute('role','listbox');
                /* The popup is mounted under BODY, outside #appShell. Copy the active theme tokens
                   so every theme (including dark palettes) styles the menu correctly. */
                const themeRoot = document.getElementById('appShell') || document.documentElement;
                const themeStyle = getComputedStyle(themeRoot);
                ['--bg-base','--bg-surface','--bg-card','--shadow-light','--shadow-dark','--shadow-darker','--text-heading','--text-body','--text-dim','--accent-coral','--accent-coral-soft'].forEach(token => {
                    const value = themeStyle.getPropertyValue(token).trim();
                    if (value) { backdrop.style.setProperty(token, value); panel.style.setProperty(token, value); }
                });
                const title = document.createElement('div'); title.id='auraSelectMenuTitle'; title.textContent = select.getAttribute('aria-label') || 'Choose option'; panel.appendChild(title);
                [...select.options].forEach(opt => { const b=document.createElement('button'); b.type='button'; b.className='aura-select-option'+(opt.value===select.value?' selected':''); b.setAttribute('role','option'); b.setAttribute('aria-selected',opt.value===select.value?'true':'false'); b.textContent=opt.textContent; if(opt.value===select.value) b.textContent += '  ✓'; b.addEventListener('click',()=>{select.value=opt.value; select.dispatchEvent(new Event('change',{bubbles:true})); refresh(); closeMenu();}); panel.appendChild(b); });
                backdrop.appendChild(panel); document.body.appendChild(backdrop);
            });
            select.addEventListener('change', refresh); refresh();
        }

        document.addEventListener('keydown', e => { if(e.key === 'Escape') document.getElementById('auraSelectMenuBackdrop')?.remove(); });
        document.addEventListener('DOMContentLoaded', () => {
            setupAuraCustomSelect(document.getElementById('songsLibrarySort'));
            setupAuraCustomSelect(document.getElementById('songsLibraryFilter'));
            document.querySelectorAll('[data-aura-app-version]').forEach(el => { el.textContent = 'v' + AURA_PULSE_APP_VERSION; });
        });

        function applySongsLibraryControls() {
            const searchEl = document.getElementById('songsLibrarySearch');
            const sortEl = document.getElementById('songsLibrarySort');
            const filterEl = document.getElementById('songsLibraryFilter');
            const extra = document.getElementById('songsLibraryFilterExtra');
            const previousFilterValue = document.getElementById('songsLibraryFilterValue')?.value || '';
            const query = (searchEl?.value || '').trim().toLocaleLowerCase();
            const sort = sortEl?.value || 'title-asc';
            const filter = filterEl?.value || 'all';
            state.songsLibrarySort = sort;
            state.songsLibraryFilter = filter;

            let list = getScopedSongs();
            updateSongsScopeChip();
            if (query) list = list.filter(s => [s.title,s.artist,s.album,s.genre].some(v => String(v || '').toLocaleLowerCase().includes(query)));
            state.displayedPlaylist = list;
            renderTrackList();
            const count = document.getElementById('songsLibraryCount');
            if (count) count.textContent = `${list.length} of ${state.playlist.length} songs`;
        }

        // Render the library in small chunks so a large offline library cannot freeze startup.
        let auraTrackRenderLimit = 120;
        const AURA_TRACK_RENDER_BATCH = 120;
        function loadMoreAuraTracks() {
            auraTrackRenderLimit += AURA_TRACK_RENDER_BATCH;
            renderTrackList(true);
        }

        function renderTrackList(keepRenderLimit = false) {
            if (!keepRenderLimit) auraTrackRenderLimit = AURA_TRACK_RENDER_BATCH;
            const container = document.getElementById('songsListDeck');
            if (!container) return;
            container.innerHTML = '';
            if (state.displayedPlaylist.length === 0) {
                container.innerHTML = `
                    <div class="empty-scan-box" onclick="document.getElementById('audioFileInput').click()">
                        <div class="empty-scan-icon"><i data-lucide="folder-plus" style="width: 24px; height: 24px;"></i></div>
                        <div style="font-size: 13.5px; font-weight: 700; color: var(--text-heading);">No Songs in Library</div>
                        <div style="font-size: 11px; color: var(--text-dim);">Tap here to scan & import audio files from device</div>
                    </div>
                `;
                if (window.lucide) lucide.createIcons();
                renderHomeViews();
                renderAlbumsAndArtists();
                renderPlaylists();
                renderSearchDiscoveryHub();
                return;
            }

            const frag = document.createDocumentFragment();
            const visibleTracks = state.displayedPlaylist.slice(0, auraTrackRenderLimit);
            visibleTracks.forEach((song) => {
                const isCurrent = (song.id === state.playlist[state.currentIndex]?.id);
                const row = document.createElement('div');
                row.className = `song-tile-row ${isCurrent ? 'active' : ''}`;
                row.id = `songTileRow_${song.id}`;
                row.onclick = () => { if (!isLongPressTriggered) playSongById(song.id, state.displayedPlaylist.map(s => s.id)); };
                row.innerHTML = `
                    <div class="song-tile-left">
                        <img class="song-tile-thumb" src="${song.cover || DEFAULT_ART}" alt="cover" loading="lazy">
                        <div class="song-tile-meta">
                            <div class="song-tile-title">${escapeHtml(song.title)}</div>
                            <div class="song-tile-artist">${escapeHtml(song.artist)} • ${song.duration}</div>
                        </div>
                    </div>
                    <div class="song-tile-actions">
                        <button class="neu-btn btn-circle-32" onclick="event.stopPropagation(); openSongActionModal(state.playlist.find(s=>s.id===${song.id}));">
                            <i data-lucide="more-vertical" style="width: 14px; height: 14px; color: var(--text-dim);"></i>
                        </button>
                    </div>
                `;
                attachSongLongPressEvents(row, song);
                frag.appendChild(row);
            });
            container.appendChild(frag);
            if (state.displayedPlaylist.length > visibleTracks.length) {
                const more = document.createElement('button');
                more.type = 'button';
                more.className = 'neu-btn';
                more.style.cssText = 'display:block;width:calc(100% - 24px);margin:12px auto;padding:13px 16px;border-radius:14px;font-weight:800;color:var(--text-heading);background:var(--bg-card);border:1px solid var(--shadow-light);';
                more.textContent = `Load more songs (${visibleTracks.length} of ${state.displayedPlaylist.length})`;
                more.onclick = loadMoreAuraTracks;
                container.appendChild(more);
            }

            renderHomeViews();
            renderAlbumsAndArtists();
            renderPlaylists();
            renderSearchDiscoveryHub();
            if (window.lucide) lucide.createIcons();
        }

        function updateActiveSongRowHighlight(newId) {
            document.querySelectorAll('.song-tile-row').forEach(row => row.classList.remove('active'));
            document.getElementById(`songTileRow_${newId}`)?.classList.add('active');
        }

