            const cleanLines = raw.split(/\r?\n/)
                .map(l => l.replace(/^\[\d{1,2}:\d{2}(?:\.\d{1,3})?\]/, '').trim())
                .filter(l => l.length > 0 && !l.startsWith('[ti:') && !l.startsWith('[ar:'));

