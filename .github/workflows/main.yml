        function playOnlineStream(title, artist, audioUrl, coverUrl, lrcText) {
            const trackUrl = audioUrl || tamilMusicCatalog[0].url;
            const trackCover = coverUrl || DEFAULT_ART;
            
            const onlineSong = {
                id: 'online_' + Date.now(),
                title: title,
                artist: artist,
                album: 'Online Tamil Stream',
                duration: '3:30',
                durationSec: 210,
                cover: trackCover,
                genre: 'Tamil',
                year: '2026',
                cachedUrl: trackUrl,
                syncedLyrics: lrcText || ""
            };

            addSongToOnlineRecent(onlineSong);

            state.playlist.unshift(onlineSong);
            state.currentIndex = 0;

            if (lrcText) {
                state.parsedLyrics = parseLrcString(lrcText);
                state.cachedLyricsMap[`${title}_${artist}`] = state.parsedLyrics;
            }

            playSongByIndex(0);
            showToast(`ஒலிக்கிறது: ${title} 🎵`);
        }

        function quickSearchOnline(query) {
            const searchInput = document.getElementById('onlineSearchInput');
            if (searchInput) searchInput.value = query;

            const q = query.toLowerCase();
            const matched = tamilMusicCatalog.find(s => 
                q.includes(s.title.toLowerCase()) || 
                s.title.toLowerCase().includes(q) ||
                q.includes(s.artist.toLowerCase()) ||
                s.artist.toLowerCase().includes(q)
            ) || tamilMusicCatalog[Math.floor(Math.random() * tamilMusicCatalog.length)];

            playOnlineStream(matched.title, matched.artist, matched.url, matched.cover, matched.lrc);
            searchOnlineTamilSongs(query);
        }

        async function searchOnlineTamilSongs(forcedQuery) {
            const q = forcedQuery || document.getElementById('onlineSearchInput').value.trim();
            if (!q) return;

            const wrap = document.getElementById('onlineSearchResultsWrap');
            const listEl = document.getElementById('onlineSearchResultsList');
            wrap.style.display = 'block';
            listEl.innerHTML = '<p style="font-size:12px; color:var(--text-dim); padding:10px;">பாடல்கள் தயாராகின்றன...</p>';

            const queryLower = q.toLowerCase();
            const localMatches = tamilMusicCatalog.filter(s => 
                s.title.toLowerCase().includes(queryLower) || 
                s.artist.toLowerCase().includes(queryLower)
            );

            try {
                const res = await fetch(`https://saavn.dev/api/search/songs?query=${encodeURIComponent(q)}`, { mode: 'cors' });
                if (res.ok) {
                    const data = await res.json();
                    const results = (data.data?.results || []).slice(0, 6);
                    if (results.length > 0) {
                        const onlineResults = results.map(s => ({
                            title: s.name,
                            artist: s.artists?.primary?.[0]?.name || s.artist || 'Tamil Artist',
                            url: s.downloadUrl ? s.downloadUrl[s.downloadUrl.length - 1].url : tamilMusicCatalog[0].url,
                            cover: s.image ? s.image[s.image.length - 1].url : DEFAULT_ART,
                            lrc: ""
                        }));
                        renderOnlineResults(onlineResults);
                        return;
                    }
                }
            } catch (err) {}

            const finalSongs = localMatches.length > 0 ? localMatches : tamilMusicCatalog.slice(0, 6);
            renderOnlineResults(finalSongs);
        }

        function renderOnlineResults(songs) {
            const listEl = document.getElementById('onlineSearchResultsList');
            listEl.innerHTML = songs.map(s => `
                <div class="song-tile-row" onclick="playOnlineStream('${escapeHtml(s.title)}', '${escapeHtml(s.artist)}', '${s.url}', '${s.cover}', \`${s.lrc || ''}\`)">
                    <div class="song-tile-left">
                        <img class="song-tile-thumb" src="${s.cover}" alt="cover">
                        <div class="song-tile-meta">
                            <div class="song-tile-title">${escapeHtml(s.title)}</div>
                            <div class="song-tile-artist">${escapeHtml(s.artist)}</div>
                        </div>
                    </div>
                    <button class="neu-btn btn-circle-32"><i data-lucide="play" style="width:13px;height:13px;fill:currentColor;color:var(--accent-coral);"></i></button>
                </div>
            `).join('');
            if (window.lucide) lucide.createIcons();
        }

        function openOnlineLikedView() {
            const wrap = document.getElementById('onlineSearchResultsWrap');
            const listEl = document.getElementById('onlineSearchResultsList');
            wrap.style.display = 'block';
            listEl.innerHTML = '';
            
            const favIds = state.customPlaylists["Favorites"] || [];
            const favSongs = state.playlist.filter(s => favIds.includes(s.id));

            if (!favSongs.length) {
                listEl.innerHTML = '<p style="font-size:12px; color:var(--text-dim); padding:12px; text-align:center;">பாடலில் ❤️ தொட்டால் இங்கே விரும்பிய பாடல்கள் தோன்றும்!</p>';
            } else {
                renderOnlineResults(favSongs.map(s => ({ title: s.title, artist: s.artist, url: s.cachedUrl || s.url, cover: s.cover, lrc: s.syncedLyrics })));
            }
            showToast("❤️ விரும்பிய பாடல்கள் (Liked Songs)");
        }

        // 4. Voice Search
        function startVoiceSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const micBtn = document.getElementById('voiceSearchMicBtn');
            const searchInput = document.getElementById('onlineSearchInput');

            if (!SpeechRecognition) {
                showToast("உங்கள் பிரவுசரில் வாய்ஸ் தேடல் வசதி இல்லை. தட்டச்சு செய்யவும்.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ta-IN';
            recognition.interimResults = false;

            recognition.onstart = () => {
                if (micBtn) micBtn.classList.add('listening');
                showToast("🎤 பேசலாம்... பாடல் அல்லது இசையமைப்பாளர் பெயரைச் சொல்லுங்கள்...");
            };

            recognition.onresult = (e) => {
                const spokenText = e.results[0][0].transcript;
                if (searchInput) searchInput.value = spokenText;
                showToast(`தேடுகிறது: "${spokenText}"`);
                searchOnlineTamilSongs();
            };

            recognition.onerror = () => {
                showToast("குரலைக் கேட்க முடியவில்லை. மீண்டும் முயற்சிக்கவும்.");
                if (micBtn) micBtn.classList.remove('listening');
            };

            recognition.onend = () => {
                if (micBtn) micBtn.classList.remove('listening');
            };

            recognition.start();
        }

        // 5. Instagram Story Lyric Card Generator
        function openLyricCardModal(customText) {
            const activeLyricEl = document.querySelector('.lyric-line-item.current-lyric');
            if (activeLyricEl && activeLyricEl.textContent && !activeLyricEl.textContent.includes('...')) {
                currentSelectedLyric = activeLyricEl.textContent.trim();
            } else if (customText) {
                currentSelectedLyric = customText;
            }
            const modal = document.getElementById('lyricCardModal');
            if (modal) modal.classList.add('show');
            if (window.lucide) lucide.createIcons();
            drawLyricStoryCard();
        }

        function closeLyricCardModal() { document.getElementById('lyricCardModal')?.classList.remove('show'); }

        function setCardTheme(theme, btn) {
            activeCardTheme = theme;
            document.querySelectorAll('.card-theme-chip').forEach(c => c.classList.remove('active'));
            if (btn) btn.classList.add('active');
            drawLyricStoryCard();
        }

        function drawLyricStoryCard() {
            const canvas = document.getElementById('lyricStoryCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;

            if (activeCardTheme === 'neon') {
                const grad = ctx.createLinearGradient(0, 0, w, h);
                grad.addColorStop(0, '#1c102a');
                grad.addColorStop(0.5, '#0b0f19');
                grad.addColorStop(1, '#081c24');
                ctx.fillStyle = grad;
            } else if (activeCardTheme === 'gold') {
                const grad = ctx.createLinearGradient(0, 0, w, h);
                grad.addColorStop(0, '#2e2106');
                grad.addColorStop(1, '#110c02');
                ctx.fillStyle = grad;
            } else if (activeCardTheme === 'emerald') {
                const grad = ctx.createLinearGradient(0, 0, w, h);
                grad.addColorStop(0, '#09291e');
                grad.addColorStop(1, '#05140f');
                ctx.fillStyle = grad;
            } else {
                ctx.fillStyle = '#14161b';
            }
            ctx.fillRect(0, 0, w, h);

            ctx.save();
            ctx.beginPath();
            ctx.arc(w / 2, h / 2 - 40, 190, 0, Math.PI * 2);
            ctx.fillStyle = activeCardTheme === 'gold' ? 'rgba(245, 158, 11, 0.18)' : 'rgba(34, 211, 238, 0.22)';
            ctx.fill();
            ctx.restore();

            const curSong = state.playlist[state.currentIndex] || { title: "ஹுகும் (Hukum)", artist: "அனிருத் ரவிச்சந்தர்" };
            const artSize = 130;
            const artX = (w - artSize) / 2;
            const artY = 160;

            ctx.save();
            ctx.beginPath();
            ctx.roundRect(artX, artY, artSize, artSize, 24);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.fill();
            ctx.strokeStyle = activeCardTheme === 'gold' ? '#f59e0b' : '#22d3ee';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.clip();
            if (cachedPipCoverImg.complete && cachedPipCoverImg.src && !cachedPipCoverImg.src.includes('undefined')) {
                ctx.drawImage(cachedPipCoverImg, artX, artY, artSize, artSize);
            } else {
                ctx.fillStyle = activeCardTheme === 'gold' ? '#f59e0b' : '#22d3ee';
                ctx.font = 'bold 44px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText("♪", w / 2, artY + artSize / 2);
            }
            ctx.restore();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px "Plus Jakarta Sans", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(curSong.title.slice(0, 26), w / 2, 340);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
            ctx.font = '600 18px "Plus Jakarta Sans", sans-serif';
            ctx.fillText(curSong.artist.slice(0, 30), w / 2, 375);

            ctx.fillStyle = activeCardTheme === 'gold' ? '#fbbf24' : '#22d3ee';
            ctx.font = 'bold 42px serif';
            ctx.fillText('“', w / 2, 470);

            ctx.font = 'bold 27px "Plus Jakarta Sans", sans-serif';
            ctx.fillStyle = '#f8fafc';
            
            const words = currentSelectedLyric.split(' ');
            let line = '';
            let lineY = 520;
            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = ctx.measureText(testLine);
                if (metrics.width > w - 100 && n > 0) {
                    ctx.fillText(line, w / 2, lineY);
                    line = words[n] + ' ';
                    lineY += 40;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, w / 2, lineY);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.font = '700 13px "JetBrains Mono", monospace';
            ctx.fillText('AURAPULSE STUDIO PRO • INSTAGRAM STORY', w / 2, 880);
        }

        function downloadLyricCardImage() {
            const canvas = document.getElementById('lyricStoryCanvas');
            if (!canvas) return;
            const a = document.createElement('a');
            a.download = `AuraPulse_Lyric_Story_${Date.now()}.png`;
            a.href = canvas.toDataURL('image/png');
            a.click();
            showToast("இன்ஸ்டா ஸ்டோரி அட்டை பதிவிறக்கப்பட்டது! 📸");
        }

        function copyLyricCardText() {
            navigator.clipboard.writeText(currentSelectedLyric);
            showToast("பாடல் வரிகள் நகலெடுக்கப்பட்டது! 📋");
        }

        // 6. Header Profile, Notif & Premium
        function openProfileModal() { document.getElementById('profileModal')?.classList.add('show'); if(window.lucide) lucide.createIcons(); }
        function closeProfileModal() { document.getElementById('profileModal')?.classList.remove('show'); }

        function openNotificationsModal() { document.getElementById('notificationsModal')?.classList.add('show'); if(window.lucide) lucide.createIcons(); }
        function closeNotificationsModal() { document.getElementById('notificationsModal')?.classList.remove('show'); }

        function openPremiumModal() { document.getElementById('premiumModal')?.classList.add('show'); if(window.lucide) lucide.createIcons(); }
        function closePremiumModal() { document.getElementById('premiumModal')?.classList.remove('show'); }

        function selectPremiumPlan(card) {
            document.querySelectorAll('.premium-plan-card').forEach(c => c.classList.remove('featured'));
            if (card) card.classList.add('featured');
        }

        function activatePremiumPlan() {
            closePremiumModal();
            showToast("🎉 AuraPulse VIP Pro 30 நாட்கள் இலவச சோதனை இயக்கப்பட்டது!");
        }

        function updateDynamicGreeting() {
            const greetingEl = document.getElementById('onlineGreetingText');
            const dateEl = document.getElementById('onlineDateText');
            if (!greetingEl) return;

            const hour = new Date().getHours();
            let greet = "காலை வணக்கம்";
            if (hour >= 12 && hour < 16) greet = "மதிய வணக்கம்";
            else if (hour >= 16 && hour < 21) greet = "மாலை வணக்கம்";
            else if (hour >= 21 || hour < 5) greet = "இனிய இரவு வணக்கம்";

            greetingEl.textContent = `${greet}, அருள்!`;
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            if (dateEl) dateEl.textContent = new Date().toLocaleDateString('ta-IN', options);
        }

        function addSongToOnlineRecent(song) {
            let recent = JSON.parse(localStorage.getItem('aura_online_recent') || '[]');
            recent = recent.filter(s => s.title !== song.title);
            recent.unshift({ title: song.title, artist: song.artist, cover: song.cover, url: song.cachedUrl || song.url });
            if (recent.length > 8) recent.pop();
            localStorage.setItem('aura_online_recent', JSON.stringify(recent));
            renderOnlineRecentCarousel();
        }

        function renderOnlineRecentCarousel() {
            const wrap = document.getElementById('onlineRecentCarousel');
            if (!wrap) return;
            const recent = JSON.parse(localStorage.getItem('aura_online_recent') || '[]');
            if (!recent.length) {
                wrap.innerHTML = `<div style="font-size: 11px; color: var(--text-dim); padding: 8px 4px;">பாடல்களைத் தொட்டு இயக்கினால் இங்கே தோன்றும்...</div>`;
                return;
            }

            wrap.innerHTML = recent.map(s => `
                <div class="carousel-card" onclick="playOnlineStream('${escapeHtml(s.title)}', '${escapeHtml(s.artist)}', '${s.url}', '${s.cover}')">
                    <div class="card-artwork-frame"><img class="card-img" src="${s.cover}" alt="cover"></div>
                    <span class="card-main-title">${escapeHtml(s.title)}</span>
                    <span class="card-subtext">${escapeHtml(s.artist)}</span>
                </div>
            `).join('');
            if (window.lucide) lucide.createIcons();
        }

        // (Online/Offline swipe gesture removed: it navigated to a non-existent screen.)


        /* ================= LOCAL MEDIA SCANNER ENGINE ================= */
        function toggleEnableLocalMedia(val) {
            state.localMediaEnabled = val;
            localStorage.setItem('aura_local_enabled', val);
            renderTrackList();
            showToast(val ? "Local media enabled" : "Local media disabled");
        }

        function toggleScanAutomatically(val) {
            state.autoScanEnabled = val;
            localStorage.setItem('aura_autoscan_enabled', val);
            showToast(val ? "Auto-scan enabled" : "Auto-scan disabled");
        }

        function triggerManualScanner() {
            document.getElementById('audioFileInput').click();
        }

        function openScanLocationsModal() { 
            document.getElementById('scanLocationsModal').classList.add('show'); 
            if(window.lucide) lucide.createIcons(); 
        }
        function closeScanLocationsModal() { 
            document.getElementById('scanLocationsModal').classList.remove('show'); 
        }

        // Folder Scan File listener
        document.addEventListener('DOMContentLoaded', () => {
            const folderInput = document.getElementById('audioFolderInput');
            if (folderInput) {
                folderInput.addEventListener('change', (e) => {
                    const files = Array.from(e.target.files);
                    if (files.length > 0) {
                        const fileInput = document.getElementById('audioFileInput');
                        // Dispatch to the audioFileInput handler
                        handleDirectScannedFiles(files);
                    }
                });
            }
        });

        async function handleDirectScannedFiles(files) {
            if (!files.length) return;
            const rescan = document.getElementById('chkRescanMetadata')?.checked;
            const linkArtists = document.getElementById('chkLinkArtists')?.checked;
            const progressWrap = document.getElementById('scanProgressWrap');
            const progressFill = document.getElementById('scanProgressFill');
            const progressText = document.getElementById('scanProgressText');

            if (progressWrap) progressWrap.style.display = 'block';
            showToast(`Adding ${files.length} songs from folder...`);

            const newSongs = [];
            const timestamp = Date.now();
            const total = files.length;

            for (let i = 0; i < total; i++) {
                const f = files[i];
                let title = f.name.replace(/\.[^/.]+$/, "");
                let artist = "Local Track";

                if (linkArtists && title.includes("-")) {
                    const parts = title.split("-");
                    artist = parts[0].trim();
                    title = parts.slice(1).join("-").trim();
                }

                const trackItem = {
                    id: timestamp + i,
                    title: title,
                    artist: artist,
                    album: "Local Audio",
                    duration: "3:30",
                    durationSec: 210,
                    cover: DEFAULT_ART,
                    genre: "Soundtrack",
                    year: "2024",
                    audioBlob: f
                };
                newSongs.push(trackItem);

                if (progressFill && progressText) {
                    const pct = Math.round(((i + 1) / total) * 100);
                    progressFill.style.width = pct + '%';
                    progressText.textContent = `Scanning: ${i + 1} of ${total} (${pct}%)`;
                }
            }

            state.playlist = [...newSongs, ...state.playlist];
            state.displayedPlaylist = [...state.playlist];
            renderTrackList();

            if (progressWrap) {
                setTimeout(() => { progressWrap.style.display = 'none'; }, 600);
            }

            // Read tags in background
            let queueIndex = 0;
            function processNextFile() {
                if (queueIndex >= newSongs.length) return;
                const songObj = newSongs[queueIndex++];
                readEmbeddedMetadata(songObj.audioBlob, songObj).then(() => {
                    saveTrackMeta(songObj);
                    saveTrackBlob(songObj.id, songObj.audioBlob);
                    if (window.requestIdleCallback) requestIdleCallback(processNextFile);
                    else setTimeout(processNextFile, 25);
                });
            }
            processNextFile();
            showToast(`✅ ${newSongs.length} songs added to library!`);
        }


        /* ================= BACK BUTTON + EXIT CONFIRMATION ================= */
        let auraAllowExit = false;
        function openExitModal() {
            document.getElementById('exitModal')?.classList.add('show');
            if (window.lucide) lucide.createIcons();
        }
        function closeExitModal() { document.getElementById('exitModal')?.classList.remove('show'); }
        function confirmExitApp() {
            auraAllowExit = true;
            try { audioElement.pause(); } catch (_) {}
            savePlayerSession(true);
            try { if (window.Android && typeof window.Android.exitApp === 'function') window.Android.exitApp(); } catch (_) {}
            try { if (navigator.app && typeof navigator.app.exitApp === 'function') navigator.app.exitApp(); } catch (_) {}
            try { window.close(); } catch (_) {}
            try { history.go(-2); } catch (_) {}
            setTimeout(() => {
                auraAllowExit = false;
                closeExitModal();
                try { history.pushState({ aura: 2 }, ''); } catch (_) {}
            }, 700);
        }
        function handleAuraBack() {
            const picker = document.getElementById('auraSelectMenuBackdrop');
            if (picker) { picker.remove(); return; }
            const openModal = document.querySelector('.app-modal-overlay.show');
            if (openModal) { openModal.classList.remove('show'); return; }
            if (document.querySelector('.header-dropdown-menu.show')) { closeAllDropdowns(); return; }
            const v = state.currentView;
            if (v === 'viewHome') { openExitModal(); return; }
            if (v === 'viewNowPlaying') { goBackView('viewHome'); return; }
            if (v === 'viewSongs' && state.songsScope) { goBackView('viewLibrary'); return; }
            if (['viewSongs', 'viewLibrary', 'viewSettings', 'viewSearch'].includes(v)) { navigateTo('viewHome'); return; }
            goBackView('viewHome');
        }
        try { history.replaceState({ aura: 1 }, ''); history.pushState({ aura: 2 }, ''); } catch (_) {}
        window.addEventListener('popstate', () => {
            if (auraAllowExit) return;
            try { history.pushState({ aura: 2 }, ''); } catch (_) {}
            handleAuraBack();
        });

</script>
