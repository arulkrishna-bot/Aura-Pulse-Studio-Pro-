        var NS='http://www.w3.org/2000/svg';
        function build(name, src){
            var svg=document.createElementNS(NS,'svg');
            var skip={'width':1,'height':1,'viewbox':1,'xmlns':1,'fill':1,'stroke':1,'stroke-width':1,'stroke-linecap':1,'stroke-linejoin':1,'class':1,'data-rendered':1};
            svg.setAttribute('xmlns',NS); svg.setAttribute('width','24'); svg.setAttribute('height','24'); svg.setAttribute('viewBox','0 0 24 24');
            svg.setAttribute('fill','none'); svg.setAttribute('stroke','currentColor'); svg.setAttribute('stroke-width','2');
            svg.setAttribute('stroke-linecap','round'); svg.setAttribute('stroke-linejoin','round');
            for(var i=0;i<src.attributes.length;i++){ var a=src.attributes[i]; if(!skip[a.name.toLowerCase()]) svg.setAttribute(a.name,a.value); }
            var extra=(src.getAttribute('class')||'').replace(/\blucide[\w-]*\b/g,'').trim();
            svg.setAttribute('class','lucide lucide-'+name+(extra?' '+extra:''));
            svg.setAttribute('data-rendered',name);
            svg.innerHTML=I[name];
            return svg;
        }
        function createIcons(opts){
            var root=(opts&&opts.root)||document;
            var nodes=root.querySelectorAll?root.querySelectorAll('[data-lucide]'):[];
            for(var i=0;i<nodes.length;i++){
                var el=nodes[i], name=el.getAttribute('data-lucide');
                if(!I[name]) continue;
                if(el.tagName.toLowerCase()==='svg' && el.getAttribute('data-rendered')===name) continue;
                el.replaceWith(build(name,el));
            }
        }
