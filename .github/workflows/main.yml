        function openLanguageModal() {
            const modal = document.getElementById('languageModal');
            if (modal) modal.classList.add('show');
            updateLanguageModalUI();
            if (window.lucide) lucide.createIcons();
        }
        function closeLanguageModal() { document.getElementById('languageModal')?.classList.remove('show'); }

        function setAppLanguage(lang) {
            currentAppLanguage = lang;
            localStorage.setItem('aura_app_language', lang);
            applyAppLanguage();
            updateLanguageModalUI();
            closeLanguageModal();
            showToast(lang === 'ta' ? "செயலி மொழி: தமிழ் மாற்றப்பட்டது! 🇮🇳" : "App language switched to English! 🌐");
        }

        function updateLanguageModalUI() {
            const isTa = currentAppLanguage === 'ta';
            const cardTa = document.getElementById('langCardTa');
            const cardEn = document.getElementById('langCardEn');
            const checkTa = document.getElementById('langCheckTa');
            const checkEn = document.getElementById('langCheckEn');

            if (cardTa && cardEn) {
                cardTa.classList.toggle('featured', isTa);
                cardEn.classList.toggle('featured', !isTa);
            }
            if (checkTa && checkEn) {
                checkTa.style.display = isTa ? 'block' : 'none';
                checkEn.style.display = !isTa ? 'block' : 'none';
            }
        }

        function applyAppLanguage() {
            const lang = currentAppLanguage;
            const dict = i18nDictionary[lang] || i18nDictionary.ta;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.textContent = dict[key];
            });

            const currentLangLabel = document.getElementById('settingsCurrentLangLabel');
            if (currentLangLabel) {
                currentLangLabel.textContent = lang === 'ta' ? "தமிழ் (Tamil)" : "English (ஆங்கிலம்)";
            }

            const searchInput = document.getElementById('onlineSearchInput');
