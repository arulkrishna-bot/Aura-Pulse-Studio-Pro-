    </div>

    <!-- Hidden Canvas & Inputs -->
    <canvas id="pipCanvas" width="480" height="270"></canvas>
    <canvas id="mediaArtCanvas" width="512" height="512"></canvas>
    <video id="pipVideo" autoplay muted playsinline></video>
    <input type="file" id="audioFileInput" multiple accept="audio/*">
    <input type="file" id="localLrcFileInput" accept=".lrc,.txt">

    <script>
        const AURA_PULSE_APP_VERSION = '3.9.7';
        const DB_NAME = "AuraPulseStorageDB";
        const DB_VERSION = 3;
        const META_STORE = "track_metadata";
        const BLOB_STORE = "track_blobs";
        const COVER_STORE = "track_covers";
        let dbInstance = null;

        const DEFAULT_ART = "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop&q=80";

        const activeUrlCache = new Map();

        let state = {
            playlist: [], 
            displayedPlaylist: [],
            songsLibrarySort: 'title-asc',
            songsLibraryFilter: 'all',
            customPlaylists: JSON.parse(localStorage.getItem("aura_custom_playlists") || '{"Favorites": []}'),
            currentIndex: 0,
            isPlaying: false,
            isShuffle: false,
            isRepeat: false,
            currentView: 'viewHome',
            currentTheme: 'light',
            currentAccent: localStorage.getItem("aura_accent_glow") || '#ff5240',
            ambientBlurEnabled: localStorage.getItem("aura_ambient_blur") === 'true',
            albumViewMode: localStorage.getItem("aura_album_view") || 'grid',
            artistViewMode: localStorage.getItem("aura_artist_view") || 'grid',
            simulatedSec: 0,
            lyricsMode: false,
            parsedLyrics: [],
            cachedLyricsMap: {},
            pipActive: false,
            sleepTimerId: null,
            sleepTimerTargetMinutes: 15,
            sleepEndOfSongActive: false,
            currentSelectedSongForAction: null,
            bassKnobVal: 6,
            virtualKnobVal: 75,
            audioBalance: 0,
            
            // LRC Editor Live State
            editorItems: [],
            editorCurrentFocus: 0
        };

        // OS/lock-screen media controls (where supported by the browser/PWA runtime).
        /* ---- Bridge to the Android app wrapper (notification + lock-screen player). Does nothing in a normal browser. ---- */
        let lastArtDataUrl = '';
        function nativeSync(withArt) {
            if (!window.Android || typeof window.Android.updateNowPlaying !== 'function') return;
            const song = state.playlist[state.currentIndex];
            if (!song) return;
            try {
                const dur = (audioElement.duration && isFinite(audioElement.duration)) ? audioElement.duration : (song.durationSec || 0);
                window.Android.updateNowPlaying(String(song.title || ''), String(song.artist || ''), !!state.isPlaying,
                    Math.floor((audioElement.currentTime || 0) * 1000), Math.floor(dur * 1000), withArt ? lastArtDataUrl : '');
            } catch (_) {}
        }

        // OS lock-screen / notification media controls (Media Session). Artwork is drawn in the AuraPulse theme.
        let mediaArtUrl = null, mediaArtToken = 0;
        function themeCss(name, fallback) {
            try {
                const root = document.getElementById('appShell') || document.documentElement;
                const probe = document.createElement('span');
                probe.style.color = `var(${name})`; probe.style.display = 'none';
                root.appendChild(probe);
                const c = getComputedStyle(probe).color; probe.remove();
                return c || fallback;
            } catch (_) { return fallback; }
        }
        function buildThemedArtwork(coverSrc) {
            return new Promise(resolve => {
                const cv = document.getElementById('mediaArtCanvas');
                if (!cv) return resolve(null);
                const img = new Image();
                if (/^https?:/i.test(coverSrc)) img.crossOrigin = 'anonymous';
                img.onload = () => {
                    try {
                        const c = cv.getContext('2d'), W = 512;
                        const base = themeCss('--bg-base', '#232a35'), card = themeCss('--bg-card', '#1b212a'), accent = themeCss('--accent-coral', '#22d3ee');
                        const g = c.createLinearGradient(0, 0, W, W);
                        g.addColorStop(0, base); g.addColorStop(1, card);
                        c.fillStyle = g; c.fillRect(0, 0, W, W);
                        const size = 380, x = (W - size) / 2, y = 52;
                        c.save();
                        c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = 36; c.shadowOffsetY = 14;
                        c.beginPath(); c.roundRect(x, y, size, size, 44); c.fillStyle = card; c.fill();
                        c.restore();
                        c.save(); c.beginPath(); c.roundRect(x, y, size, size, 44); c.clip();
                        c.drawImage(img, x, y, size, size); c.restore();
                        c.lineWidth = 4; c.strokeStyle = accent; c.globalAlpha = 0.85;
                        c.beginPath(); c.roundRect(x, y, size, size, 44); c.stroke(); c.globalAlpha = 1;
                        c.fillStyle = accent; c.font = "800 22px 'Plus Jakarta Sans', sans-serif"; c.textAlign = 'center'; c.textBaseline = 'middle';
                        c.fillText('AURAPULSE STUDIO PRO', W / 2, 482);
                        try { lastArtDataUrl = cv.toDataURL('image/jpeg', 0.85); } catch (_) { lastArtDataUrl = ''; }
                        cv.toBlob(b => resolve(b ? URL.createObjectURL(b) : null), 'image/png');
                    } catch (e) { resolve(null); }
                };
                img.onerror = () => resolve(null);
                img.src = coverSrc;
            });
        }
        function updateMediaPosition() {
            if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
            const now = Date.now();
            if (now - (updateMediaPosition.last || 0) < 1000) return;
            updateMediaPosition.last = now;
            const d = audioElement.duration;
            if (!Number.isFinite(d) || d <= 0) return;
            try { navigator.mediaSession.setPositionState({ duration: d, playbackRate: audioElement.playbackRate || 1, position: Math.min(d, Math.max(0, audioElement.currentTime || 0)) }); } catch (_) {}
        }
        function updateMediaSession(song) {
            if (!('mediaSession' in navigator) || !song) return;
            try {
                const cover = song.cover || DEFAULT_ART;
                const meta = (art) => { if ('MediaMetadata' in window) navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title || 'Unknown Track', artist: song.artist || 'AuraPulse Studio',
                    album: song.album || 'AuraPulse Studio',
                    artwork: [{ src: art, sizes: '512x512', type: 'image/png' }]
                }); };
                meta(cover);
                lastArtDataUrl = '';
                nativeSync(false);
                const token = ++mediaArtToken;
                buildThemedArtwork(cover).then(url => {
                    if (!url) return;
                    if (token !== mediaArtToken || state.playlist[state.currentIndex]?.id !== song.id) { URL.revokeObjectURL(url); return; }
                    const old = mediaArtUrl; mediaArtUrl = url; meta(url); nativeSync(true);
                    if (old) setTimeout(() => URL.revokeObjectURL(old), 3000);
                });
                navigator.mediaSession.playbackState = state.isPlaying ? 'playing' : 'paused';
                const handlers = {
                    play: () => playAudio(), pause: () => pauseAudio(),
                    stop: () => pauseAudio(),
                    previoustrack: () => playPreviousSong(), nexttrack: () => playNextSong(),
                    seekbackward: (d) => { audioElement.currentTime = Math.max(0, audioElement.currentTime - (d.seekOffset || 10)); },
                    seekforward: (d) => { audioElement.currentTime = Math.min(audioElement.duration || Infinity, audioElement.currentTime + (d.seekOffset || 10)); },
                    seekto: (d) => { if (Number.isFinite(d.seekTime)) audioElement.currentTime = d.seekTime; }
                };
                Object.entries(handlers).forEach(([action, handler]) => { try { navigator.mediaSession.setActionHandler(action, handler); } catch (_) {} });
                updateMediaPosition.last = 0; updateMediaPosition();
            } catch (e) { console.debug('Media Session unavailable', e); }
        }

        function syncMediaPlaybackState() {
            nativeSync(false);
            if ('mediaSession' in navigator) { try { navigator.mediaSession.playbackState = state.isPlaying ? 'playing' : 'paused'; } catch (_) {} }
        }

        let audioElement = new Audio();
        audioElement.preload = "auto";
        audioElement.setAttribute('playsinline', '');
        audioElement.addEventListener('seeked', () => nativeSync(false));
        audioElement.addEventListener('loadedmetadata', () => nativeSync(false));
        audioElement.setAttribute('webkit-playsinline', '');

        /* ========================================================
           1. WEB AUDIO API & REALTIME BASS PULSE VISUALIZER
           ======================================================== */
        let webAudioCtx = null;
        let webAudioAnalyser = null;
        let webAudioSource = null;
        let bassVisualizerRunning = false;
        let smoothedBassIntensity = 0;

        /* Audio now plays straight through the <audio> element. Routing it through a WebAudio graph made
           Android pause/silence the sound as soon as the app went to the background or the phone locked. */
        function initWebAudioVisualizer() { /* intentionally disabled */ }

        function startBassPulseAnalysisLoop() {
            if (bassVisualizerRunning) return;
            bassVisualizerRunning = true;
            const dataArray = new Uint8Array(webAudioAnalyser.frequencyBinCount);

            let lastVisualFrameAt = 0;
            function updateLoop(timestamp) {
                if (!state.isPlaying || !webAudioAnalyser) {
                    bassVisualizerRunning = false;
                    return;
                }
                if (timestamp - lastVisualFrameAt < 32) {
                    requestAnimationFrame(updateLoop);
                    return;
                }
                lastVisualFrameAt = timestamp;
                if (state.isPlaying && webAudioAnalyser) {
                    webAudioAnalyser.getByteFrequencyData(dataArray);

                    // Extract Bass/Sub-Bass (Bins 1..7 ~ 30Hz - 160Hz)
                    let bassEnergy = 0;
                    for (let i = 1; i <= 6; i++) {
                        bassEnergy += dataArray[i];
                    }
                    const rawIntensity = Math.min(1, bassEnergy / (6 * 190));
                    smoothedBassIntensity = (smoothedBassIntensity * 0.65) + (rawIntensity * 0.35);

                    // 1. Reactive Glow Pulse on Ambient Background
                    const ambientEl = document.getElementById('ambientBgCover');
                    if (ambientEl && state.ambientBlurEnabled) {
                        const targetScale = 1.0 + (smoothedBassIntensity * 0.08);
                        const targetAlpha = 0.32 + (smoothedBassIntensity * 0.16);
                        ambientEl.style.transform = `scale(${targetScale})`;
                        ambientEl.style.opacity = targetAlpha;
                    }

                    // 2. Reactive Beat Bounce on Active Lyric Line
                    const activeLyric = document.querySelector('.lyric-line-item.current-lyric');
                    if (activeLyric) {
                        const lyricScale = 1.10 + (smoothedBassIntensity * 0.08);
                        activeLyric.style.transform = `scale(${lyricScale})`;
                    }
                }
                requestAnimationFrame(updateLoop);
            }
            requestAnimationFrame(updateLoop);
        }

        /* ========================================================
           2. DATABASE (INDEXEDDB) CORE
           ======================================================== */
        function initDatabase() {
            return new Promise((resolve) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = function(e) {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(META_STORE)) {
                        db.createObjectStore(META_STORE, { keyPath: "id" });
                    }
                    if (!db.objectStoreNames.contains(BLOB_STORE)) {
                        db.createObjectStore(BLOB_STORE, { keyPath: "id" });
                    }
                    if (!db.objectStoreNames.contains(COVER_STORE)) {
                        db.createObjectStore(COVER_STORE, { keyPath: "id" });
                    }
                };
                req.onsuccess = function(e) {
                    dbInstance = e.target.result;
                    resolve(dbInstance);
                };
                req.onerror = () => resolve(null);
            });
        }

        function saveTrackMeta(track) {
            return new Promise((resolve) => {
                if (!dbInstance) return resolve();
                try {
                    const cleanTrack = { ...track };
                    delete cleanTrack.audioBlob;
                    delete cleanTrack.cachedUrl;
                    delete cleanTrack._legacyCover;
                    let coverBlob = null;
                    if (track._coverPending) {
                        cleanTrack.cover = '__stored__';
                    } else if (typeof cleanTrack.cover === 'string') {
                        if (cleanTrack.cover.startsWith('data:')) {
                            coverBlob = dataUrlToBlob(cleanTrack.cover);
                            cleanTrack.cover = coverBlob ? '__stored__' : DEFAULT_ART;
                        } else if (cleanTrack.cover.startsWith('blob:')) {
                            cleanTrack.cover = '__stored__';
                        }
                    }
                    delete cleanTrack._coverPending;
                    const stores = coverBlob ? [META_STORE, COVER_STORE] : [META_STORE];
                    const tx = dbInstance.transaction(stores, "readwrite");
                    tx.objectStore(META_STORE).put(cleanTrack);
                    if (coverBlob) tx.objectStore(COVER_STORE).put({ id: track.id, blob: coverBlob });
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => resolve();
                } catch (e) { resolve(); }
            });
        }

        function saveTrackBlob(id, blob) {
            return new Promise((resolve) => {
                if (!dbInstance || !blob) return resolve();
                try {
                    const tx = dbInstance.transaction(BLOB_STORE, "readwrite");
                    const store = tx.objectStore(BLOB_STORE);
                    store.put({ id: id, blob: blob });
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => resolve();
                } catch (e) { resolve(); }
            });
        }

        function getTrackBlob(id) {
            return new Promise((resolve) => {
                if (!dbInstance) return resolve(null);
                try {
                    const tx = dbInstance.transaction(BLOB_STORE, "readonly");
                    const store = tx.objectStore(BLOB_STORE);
                    const req = store.get(id);
                    req.onsuccess = () => resolve(req.result ? req.result.blob : null);
                    req.onerror = () => resolve(null);
                } catch (e) { resolve(null); }
            });
        }

        function deleteTrackFromDatabase(id) {
            return new Promise((resolve) => {
                if (!dbInstance) return resolve();
                try {
                    const tx = dbInstance.transaction([META_STORE, BLOB_STORE, COVER_STORE], "readwrite");
                    tx.objectStore(META_STORE).delete(id);
                    tx.objectStore(BLOB_STORE).delete(id);
                    tx.objectStore(COVER_STORE).delete(id);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => resolve();
                } catch (e) { resolve(); }
            });
        }

        function loadAllTrackMeta() {
            return new Promise((resolve) => {
                if (!dbInstance) return resolve([]);
                try {
                    const tx = dbInstance.transaction(META_STORE, "readonly");
                    const store = tx.objectStore(META_STORE);
                    const req = store.getAll();
                    req.onsuccess = () => {
                        const tracks = (req.result || []).filter(t => ![101, 102, 103, 104].includes(t.id));
                        tracks.forEach(t => {
                            if (t.cover === '__stored__') { t.cover = DEFAULT_ART; t._coverPending = true; }
                            else if (typeof t.cover === 'string' && t.cover.startsWith('data:')) { t._legacyCover = t.cover; t.cover = DEFAULT_ART; t._coverPending = true; }
                        });
                        resolve(tracks);
                    };
                    req.onerror = () => resolve([]);
                } catch (e) { resolve([]); }
            });
        }

        /* Album art is kept in its own store so the library list opens fast (covers load in the background). */
        function dataUrlToBlob(dataUrl) {
            try {
                const i = dataUrl.indexOf(',');
                const mime = (dataUrl.slice(5, i).split(';')[0]) || 'image/jpeg';
                const bin = atob(dataUrl.slice(i + 1));
                const arr = new Uint8Array(bin.length);
                for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
                return new Blob([arr], { type: mime });
            } catch (e) { return null; }
        }

        function getCoverBlob(id) {
            return new Promise((resolve) => {
                if (!dbInstance) return resolve(null);
                try {
                    const req = dbInstance.transaction(COVER_STORE, "readonly").objectStore(COVER_STORE).get(id);
                    req.onsuccess = () => resolve(req.result ? req.result.blob : null);
                    req.onerror = () => resolve(null);
                } catch (e) { resolve(null); }
            });
        }

        function putCoverBlob(id, blob) {
            return new Promise((resolve) => {
                if (!dbInstance || !blob) return resolve();
                try {
                    const tx = dbInstance.transaction(COVER_STORE, "readwrite");
                    tx.objectStore(COVER_STORE).put({ id: id, blob: blob });
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => resolve();
                } catch (e) { resolve(); }
            });
        }

        function refreshCoverUI(final) {
            renderHomeViews();
            const cur = state.playlist[state.currentIndex];
            if (cur && cur.cover) {
                const a = document.getElementById('playerCoverImg'); if (a) a.src = cur.cover;
                const b = document.getElementById('dockedMiniThumb'); if (b) b.src = cur.cover;
                cachedPipCoverImg.src = cur.cover;
            }
            if (final) renderTrackList(true);
        }

        async function hydrateTrackCovers() {
            const pending = state.playlist.filter(t => t._coverPending);
            if (!pending.length) return;
            let n = 0;
            for (const t of pending) {
                try {
                    let blob = null, migrated = false;
                    if (t._legacyCover) {
                        blob = dataUrlToBlob(t._legacyCover);
                        if (blob) await putCoverBlob(t.id, blob);
                        delete t._legacyCover;
                        migrated = true;
                    } else {
                        blob = await getCoverBlob(t.id);
                    }
                    if (blob) t.cover = URL.createObjectURL(blob);
                    delete t._coverPending;
                    if (migrated) await saveTrackMeta(t);
                } catch (e) { delete t._coverPending; }
                if (++n % 12 === 0) {
                    await new Promise(r => setTimeout(r, 20));
                    refreshCoverUI(false);
                }
            }
            refreshCoverUI(true);
        }


        /* ---- Themed dialogs: same look as the rest of the player ---- */
        function auraDialog(opts) {
            return new Promise(resolve => {
                const ov = document.getElementById('auraDialog');
                const inp = document.getElementById('auraDialogInput');
                const ok = document.getElementById('auraDialogOk');
                const cancel = document.getElementById('auraDialogCancel');
                document.getElementById('auraDialogTitle').textContent = opts.title || 'AuraPulse Studio';
                document.getElementById('auraDialogMsg').textContent = opts.message || '';
                ok.textContent = opts.okText || 'OK';
                cancel.textContent = opts.cancelText || 'Cancel';
                ok.style.background = opts.danger ? 'linear-gradient(135deg, #ef4444, #b91c1c)' : '';
                inp.style.display = opts.input ? 'block' : 'none';
                inp.value = opts.value || '';
                inp.placeholder = opts.placeholder || '';
                const done = (val) => { ov.classList.remove('show'); ok.onclick = cancel.onclick = inp.onkeydown = null; resolve(val); };
                ok.onclick = () => done(opts.input ? inp.value : true);
                cancel.onclick = () => done(opts.input ? null : false);
                inp.onkeydown = (e) => { if (e.key === 'Enter') ok.onclick(); };
                ov.classList.add('show');
                if (opts.input) setTimeout(() => inp.focus(), 80);
            });
        }
