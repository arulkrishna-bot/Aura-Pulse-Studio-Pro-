        // 2. Global Mode Switching with Distinct Bottom Navigation Bars
        function switchGlobalMode(mode) {
            const slider = document.getElementById('globalPillSlider');
            const btnOnline = document.getElementById('btnGlobalOnline');
            const btnOffline = document.getElementById('btnGlobalOffline');
            const onlineNav = document.getElementById('onlineBottomNav');
            const offlineNav = document.getElementById('offlineBottomNav');

            if (mode === 'offline') {
                if (slider) slider.style.transform = 'translateX(100%)';
                if (btnOffline) btnOffline.classList.add('active');
                if (btnOnline) btnOnline.classList.remove('active');
                if (onlineNav) onlineNav.style.display = 'none';
                if (offlineNav) offlineNav.style.display = 'flex';
                globalCurrentMode = 'offline';
                navigateTo('viewHome');
                showToast("AuraPulse Offline Studio Pro 🎧");
            } else {
                if (slider) slider.style.transform = 'translateX(0%)';
                if (btnOnline) btnOnline.classList.add('active');
                if (btnOffline) btnOffline.classList.remove('active');
                if (onlineNav) onlineNav.style.display = 'flex';
                if (offlineNav) offlineNav.style.display = 'none';
                globalCurrentMode = 'online';
                navigateTo('viewOnlineHome');
                showToast("Online Tamil Music Hub 🌐");
            }
        }

