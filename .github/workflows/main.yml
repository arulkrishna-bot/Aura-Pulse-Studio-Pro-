        function loadEditedLyricsText() {
            const raw = document.getElementById('lrcEditorRawText')?.value || '';
            const lines = raw.replace(/\r/g, '').split('\n').map(line => line.trim()).filter(Boolean);
            if (!lines.length) { showToast('Paste or type lyrics first'); return; }
            state.editorItems = lines.map((line, idx) => ({ text: line, timeMs: state.editorItems[idx]?.timeMs >= 0 ? state.editorItems[idx].timeMs : -1 }));
            state.editorCurrentFocus = Math.min(state.editorCurrentFocus, state.editorItems.length - 1);
            renderLrcEditorList();
            showToast(`Loaded ${lines.length} lyric lines. Stamp timings or save.`);
        }

        async function copyEditedLrc() {
            const curSong = state.playlist[state.currentIndex];
            const title = curSong?.title || 'AuraPulse Lyrics';
            const artist = curSong?.artist || 'Unknown Artist';
            const lines = [`[ti:${title}]`, `[ar:${artist}]`, '[by:AuraPulse Studio Pro]', ...state.editorItems.map(item => item.timeMs >= 0 ? `${formatLrcStamp(item.timeMs)} ${item.text}` : item.text)];
            const text = lines.join('\n');
            try { await navigator.clipboard.writeText(text); showToast('LRC copied to clipboard'); }
            catch (_) {
                const box = document.getElementById('lrcEditorRawText');
                if (box) { box.value = text; box.focus(); box.select(); showToast('Select and copy the LRC text manually'); }
            }
        }

        function focusEditorLine(idx) {
            state.editorCurrentFocus = idx;
            renderLrcEditorList();
            const songTime = state.editorItems[idx]?.timeMs;
            if (songTime >= 0 && audioElement.duration) {
                audioElement.currentTime = songTime / 1000;
            }
        }

        function fineTuneEditorTime(idx, deltaMs) {
            const item = state.editorItems[idx];
            if (!item) return;
            if (item.timeMs < 0) item.timeMs = 0;
            item.timeMs = Math.max(0, item.timeMs + deltaMs);
            renderLrcEditorList();
        }

        function stampNextEditorLine() {
            if (!audioElement) return;
            const currentMs = Math.round((audioElement.currentTime || state.simulatedSec || 0) * 1000);
            const idx = state.editorCurrentFocus;

            if (idx < state.editorItems.length) {
                state.editorItems[idx].timeMs = currentMs;
                if (idx + 1 < state.editorItems.length) {
                    state.editorCurrentFocus = idx + 1;
                }
                renderLrcEditorList();
            }
        }

        function formatLrcStamp(ms) {
            if (ms < 0) return "[--:--.--]";
            const min = Math.floor(ms / 60000);
            const sec = Math.floor((ms % 60000) / 1000);
            const hundredths = Math.floor((ms % 1000) / 10);
            return `[${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}.${hundredths < 10 ? '0' : ''}${hundredths}]`;
        }

        let editorTimerInterval = null;
        function startEditorTimerLoop() {
            if (editorTimerInterval) clearInterval(editorTimerInterval);
            editorTimerInterval = setInterval(() => {
                const el = document.getElementById('lrcEditorLiveTime');
                const playIcon = document.getElementById('lrcEditorPlayBtnIcon');
                if (el) {
                    const cur = (audioElement.currentTime || state.simulatedSec || 0);
                    const min = Math.floor(cur / 60);
                    const sec = Math.floor(cur % 60);
                    const ms = Math.floor((cur % 1) * 100);
                    el.textContent = `${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}.${ms < 10 ? '0' : ''}${ms}`;
                }
                if (playIcon) {
                    playIcon.setAttribute('data-lucide', state.isPlaying ? 'pause' : 'play');
                    if (window.lucide) lucide.createIcons();
                }
            }, 60);
        }

        async function saveLrcFromEditor() {
            const curSong = state.playlist[state.currentIndex];
            if (!curSong) {
                showToast("No active song to save LRC");
                return;
            }

            let lrcText = `[ti:${curSong.title}]\n[ar:${curSong.artist}]\n[by:AuraPulse Studio Pro]\n`;
            state.editorItems.forEach(item => {
                if (item.timeMs >= 0) {
                    lrcText += `${formatLrcStamp(item.timeMs)} ${item.text}\n`;
                } else {
                    lrcText += `${item.text}\n`;
                }
            });

            curSong.syncedLyrics = lrcText;
            state.parsedLyrics = parseLrcString(lrcText);
            state.cachedLyricsMap[`${curSong.title}_${curSong.artist}`] = state.parsedLyrics;

            await saveTrackMeta(curSong);
            renderLyricsLines();
            closeLrcEditorModal();
            showToast("LRC Saved to Song & Cache! 💾");
        }

