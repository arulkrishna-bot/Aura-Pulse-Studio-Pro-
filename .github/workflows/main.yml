        function cleanSongQuery(raw) {
            return (raw || "")
                .replace(/\(.*?\)/g, '')
                .replace(/\[.*?\]/g, '')
                .replace(/from\s+.*$/i, '')
                .replace(/feat\..*$/i, '')
                .replace(/\.mp3|\.wav|\.m4a|\.flac/ig, '')
                .trim();
        }

        let lyricsFetchTimeout = null;
        let lyricsRequestToken = 0;

        function lyricsRecordToLines(data) {
            if (data && data.hasWordSync && data.lyricsfile && window.jsyaml) {
                try {
                    const doc = jsyaml.load(data.lyricsfile);
                    const rawLines = Array.isArray(doc?.lines) ? doc.lines : [];
                    const wordLines = rawLines.map(line => {
                        const words = Array.isArray(line.words) ? line.words.map(word => {
                            const raw = word.start_ms ?? word.startMs ?? word.startTimeMs ?? word.time_ms;
                            const time = Number(raw);
                            return { text: String(word.text ?? word.word ?? ''), time: Number.isFinite(time) ? time / 1000 : null };
                        }).filter(word => word.text.length > 0) : [];
                        const rawStart = line.start_ms ?? line.startMs ?? line.startTimeMs ?? line.time_ms;
                        const startTime = Number(rawStart);
                        const text = String(line.text ?? words.map(w => w.text).join(' ')).trim();
                        const validWords = words.length > 0 && words.every(w => w.time !== null);
                        const time = Number.isFinite(startTime) ? startTime / 1000 : (validWords ? words[0].time : null);
                        return { time, text, words: validWords ? words : null };
                    }).filter(line => Number.isFinite(line.time) && line.text);
                    if (wordLines.length) return wordLines.sort((a, b) => a.time - b.time);
                } catch (err) {
                    console.warn('Lyricsfile parsing failed; trying LRC fallback.', err);
                }
            }
            if (data?.syncedLyrics) return parseLrcString(data.syncedLyrics);
            if (data?.plainLyrics) return generatePlainLines(data.plainLyrics, data.duration || state.playlist[state.currentIndex]?.durationSec || 200);
            return [];
        }

        function fetchLiveLyricsForCurrentTrack() {
            const song = state.playlist[state.currentIndex];
            if (!song) return;
            const requestToken = ++lyricsRequestToken;
            const cacheKey = `${song.title}_${song.artist}`;

            // Check In-memory or song-embedded cached lyrics
            if (song.syncedLyrics) {
                state.parsedLyrics = parseLrcString(song.syncedLyrics);
                renderLyricsLines();
                updateLyricsScroll(audioElement.currentTime || state.simulatedSec || 0);
                return;
            }
            if (state.cachedLyricsMap[cacheKey]) {
                state.parsedLyrics = state.cachedLyricsMap[cacheKey];
                renderLyricsLines();
                updateLyricsScroll(audioElement.currentTime || state.simulatedSec || 0);
                return;
            }

            if (lyricsFetchTimeout) clearTimeout(lyricsFetchTimeout);
            lyricsFetchTimeout = setTimeout(async () => {
                const cleanTitle = cleanSongQuery(song.title);
                const cleanArtist = cleanSongQuery(song.artist === 'Local Track' ? '' : song.artist);
                const statusTag = document.getElementById('lyricsStatusTag');
                if (statusTag) statusTag.textContent = 'Fetching Real Lyrics...';

                try {
                    const url = new URL('https://lrclib.net/api/get');
                    url.searchParams.set('track_name', cleanTitle);
                    url.searchParams.set('artist_name', cleanArtist || '');
                    if (song.album) url.searchParams.set('album_name', cleanSongQuery(song.album));
                    const duration = Number(song.durationSec || song.durationSeconds || 0);
                    if (duration > 0 && duration <= 3600) url.searchParams.set('duration', String(Math.round(duration)));

                    const res = await fetch(url.toString(), { headers: { 'Lrclib-Client': 'AuraPulse Studio Pro' } });
                    if (requestToken !== lyricsRequestToken) return;

                    if (res.ok) {
                        const data = await res.json();
                        const parsed = lyricsRecordToLines(data);
                        if (parsed.length) {
                            state.parsedLyrics = parsed;
                            state.cachedLyricsMap[cacheKey] = parsed;
                            if (statusTag) statusTag.textContent = parsed.some(line => line.words) ? 'Live Word Sync Active' : (data.syncedLyrics ? 'Live Synced Lyrics Active' : 'Plain Lyrics Mode');
                            renderLyricsLines();
                            updateLyricsScroll(audioElement.currentTime || state.simulatedSec || 0);
                            return;
                        }
                    }
                } catch (err) {
                    console.warn('Online lyrics fetch failed', err);
                }
                if (requestToken !== lyricsRequestToken) return;
                // Fallback search handles alternate spellings, featured artists and remastered titles.
                try {
                    const q = encodeURIComponent([cleanTitle, cleanArtist].filter(Boolean).join(' '));
                    const fallbackRes = await fetch(`https://lrclib.net/api/search?q=${q}`);
                    if (fallbackRes.ok && requestToken === lyricsRequestToken) {
                        const results = await fallbackRes.json();
                        const targetDuration = Number(song.durationSec || 0);
                        const ranked = (Array.isArray(results) ? results : []).map(item => {
                            const timed = item.syncedLyrics || item.instrumental ? 2 : 0;
                            const words = item.hasWordSync ? 3 : 0;
                            const duration = Number(item.duration || 0);
                            const durationScore = targetDuration && duration ? Math.max(0, 1 - Math.abs(duration-targetDuration)/Math.max(targetDuration,1)) : 0;
                            return { item, score: words + timed + durationScore };
                        }).sort((a,b)=>b.score-a.score);
                        for (const candidate of ranked) {
                            const parsed = lyricsRecordToLines(candidate.item);
                            if (parsed.length) {
                                state.parsedLyrics = parsed;
                                state.cachedLyricsMap[cacheKey] = parsed;
                                song.syncedLyrics = candidate.item.syncedLyrics || song.syncedLyrics || '';
                                song.plainLyrics = candidate.item.plainLyrics || song.plainLyrics || '';
                                await saveTrackMeta(song);
                                if (statusTag) statusTag.textContent = candidate.item.hasWordSync ? 'Live Word Sync Active' : 'Live Synced Lyrics Active';
                                renderLyricsLines(); updateLyricsScroll(audioElement.currentTime || state.simulatedSec || 0); return;
                            }
                        }
                    }
                } catch (fallbackErr) { console.debug('Lyrics fallback unavailable', fallbackErr); }
                if (requestToken !== lyricsRequestToken) return;
                if (statusTag) statusTag.textContent = 'Timed Lyrics Not Found — Search / Add LRC';
                state.parsedLyrics = [];
                renderLyricsLines();
            }, 250);
        }

        async function executeOnlineLyricsSearch() {
            const trackVal = document.getElementById('lyricsInputTrack').value.trim();
            const artistVal = document.getElementById('lyricsInputArtist').value.trim();

            if (!trackVal) {
                showToast("Please enter a track name");
