        function parseLrcString(lrcText) {
            const result = [];
            const timeReg = /\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/g;
            String(lrcText || '').split(/\r?\n/).forEach(line => {
                const matches = [...line.matchAll(timeReg)];
                const text = line.replace(timeReg, '').trim();
                if (!text || !matches.length) return;
                matches.forEach(match => {
                    const fraction = (match[3] || '0').padEnd(3, '0');
                    const time = Number(match[1]) * 60 + Number(match[2]) + Number(fraction) / 1000;
                    result.push({ time, text, words: null });
                });
            });
            return result.sort((a, b) => a.time - b.time);
        }

        function generatePlainLines(plainText, totalSec) {
            const rawLines = plainText.split('\n').filter(l => l.trim().length > 0);
            const step = Math.max(3, Math.floor(totalSec / (rawLines.length || 1)));
            return rawLines.map((txt, idx) => ({
                time: idx * step,
                text: txt.trim()
            }));
        }

        function renderLyricsLines() {
            const container = document.getElementById('lyricsLinesWrap');
            if (!container) return;
            container.replaceChildren();
            if (!state.parsedLyrics || !state.parsedLyrics.length) {
                const empty = document.createElement('div');
                empty.className = 'lyric-line-item';
                empty.textContent = 'No timed lyrics found. Tap Search or Open LRC Editor.';
                container.appendChild(empty);
                return;
            }
            state.parsedLyrics.forEach((lyr, idx) => {
                const row = document.createElement('div');
                row.className = 'lyric-line-item' + (idx === 0 ? ' current-lyric' : '') + (lyr.words ? ' word-sync-available' : '');
                row.id = `lyricLine${idx}`;
                row.addEventListener('click', () => jumpToLyricTime(lyr.time));
                if (Array.isArray(lyr.words) && lyr.words.length) {
                    lyr.words.forEach((word, wordIndex) => {
                        const span = document.createElement('span');
                        span.className = 'lyric-word';
                        span.dataset.wordIndex = String(wordIndex);
                        span.textContent = word.text;
                        row.appendChild(span);
                        if (wordIndex < lyr.words.length - 1) row.appendChild(document.createTextNode(' '));
                    });
                } else {
                    row.textContent = lyr.text;
                }
                container.appendChild(row);
            });
        }

        function jumpToLyricTime(t) {
            if (audioElement.src && !isNaN(audioElement.duration)) {
                audioElement.currentTime = t;
            } else {
                state.simulatedSec = t;
                document.getElementById('labelCurrentTime').textContent = formatSeconds(t);
                const pct = (t / (state.playlist[state.currentIndex]?.durationSec || 200)) * 100;
                document.getElementById('studioSeekFill').style.width = pct + '%';
            }
        }

        // Ultra Smooth GPU Translate Scroll Function
        let lastActiveLyricIndex = -1;
        function updateLyricsScroll(currentTime) {
            if (!state.parsedLyrics || !state.parsedLyrics.length) return;
            let currentIdx = -1;
            for (let i = 0; i < state.parsedLyrics.length; i++) {
                if (currentTime >= state.parsedLyrics[i].time) currentIdx = i;
                else break;
            }

            document.querySelectorAll('.lyric-line-item').forEach((el, idx) => {
                el.classList.toggle('current-lyric', idx === currentIdx);
            });

            // GPU Translate3D transform replaces heavy layout-thrashing scrollIntoView
            if (currentIdx >= 0 && currentIdx !== lastActiveLyricIndex) {
                lastActiveLyricIndex = currentIdx;
                const activeEl = document.getElementById(`lyricLine${currentIdx}`);
                const viewport = document.getElementById('lyricsViewport');
                const wrap = document.getElementById('lyricsLinesWrap');
                if (activeEl && viewport && wrap) {
                    const viewportHalf = viewport.clientHeight / 2;
                    const targetTop = activeEl.offsetTop + (activeEl.clientHeight / 2);
                    const translateY = Math.max(0, targetTop - viewportHalf);
                    wrap.style.transform = `translate3d(0, -${translateY}px, 0)`;
                }
            }

            // Word-level karaoke sync
            document.querySelectorAll('.lyric-word.word-active').forEach(w => w.classList.remove('word-active'));
            const activeLine = currentIdx >= 0 ? state.parsedLyrics[currentIdx] : null;
            if (activeLine?.words) {
                let activeWord = -1;
                for (let i = 0; i < activeLine.words.length; i++) {
                    if (currentTime >= activeLine.words[i].time) activeWord = i;
                    else break;
                }
                const row = document.getElementById(`lyricLine${currentIdx}`);
                row?.querySelectorAll('.lyric-word').forEach((word, idx) => {
                    word.classList.toggle('word-active', idx === activeWord);
                });
            }
        }

