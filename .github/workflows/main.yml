        function closeLrcEditorModal() {
            document.getElementById('lrcEditorModal')?.classList.remove('show');
        }

        function renderLrcEditorList() {
            const wrap = document.getElementById('lrcEditorLinesWrap');
            if (!wrap) return;
            wrap.innerHTML = state.editorItems.map((item, idx) => {
                const isFocused = idx === state.editorCurrentFocus;
                const formattedTime = formatLrcStamp(item.timeMs);
                return `
                    <div class="lrc-editor-item-row ${isFocused ? 'focused' : ''}" onclick="focusEditorLine(${idx})">
                        <span class="lrc-time-badge">${formattedTime}</span>
                        <span style="flex:1; font-size:12px; font-weight:700; color:var(--text-heading); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding: 0 8px;">${escapeHtml(item.text)}</span>
                        <div style="display:flex; gap:4px;">
                            <button class="lrc-fine-btn" onclick="event.stopPropagation(); fineTuneEditorTime(${idx}, -500)">-0.5s</button>
                            <button class="lrc-fine-btn" onclick="event.stopPropagation(); fineTuneEditorTime(${idx}, 500)">+0.5s</button>
                        </div>
                    </div>
                `;
            }).join('');
