        /* LONG PRESS GESTURE */
        let longPressTimer = null;
        let isLongPressTriggered = false;

        function attachSongLongPressEvents(rowEl, song) {
            const startPress = () => {
                isLongPressTriggered = false;
                rowEl.classList.add('pressing');
                longPressTimer = setTimeout(() => {
                    isLongPressTriggered = true;
                    rowEl.classList.remove('pressing');
                    if (navigator.vibrate) navigator.vibrate(60);
                    openSongActionModal(song);
                }, 650);
            };
            const cancelPress = () => {
                rowEl.classList.remove('pressing');
                if (longPressTimer) clearTimeout(longPressTimer);
            };

            rowEl.addEventListener('touchstart', startPress, { passive: true });
            rowEl.addEventListener('touchend', (e) => {
                if (isLongPressTriggered) { e.preventDefault(); e.stopPropagation(); }
                cancelPress();
            });
            rowEl.addEventListener('touchmove', cancelPress);
            rowEl.addEventListener('mousedown', startPress);
            rowEl.addEventListener('mouseup', cancelPress);
            rowEl.addEventListener('mouseleave', cancelPress);
        }

