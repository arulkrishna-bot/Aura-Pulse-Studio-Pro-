        const CAST_HELP = "Songs stored on this phone can't be sent straight to a Chromecast from inside the app. To hear them on your TV: open Quick Settings → Cast / Smart View, pick your TV, and the music plays there.";
        let castWatchId = null;

        function setCastStatus(txt) { const el = document.getElementById('castStatusText'); if (el) el.textContent = txt; }

        function updateCastStatus() {
            if (window.Android && typeof window.Android.openCast === 'function') {
                setCastStatus("Tap the button below to open your phone's Cast settings, choose your TV, and this music will play on it.");
                return;
            }
            const remote = audioElement.remote;
            if (remote && typeof remote.watchAvailability === 'function') {
                setCastStatus('Searching for Cast devices on your Wi-Fi…');
                if (castWatchId !== null) { try { remote.cancelWatchAvailability(castWatchId); } catch (_) {} castWatchId = null; }
                remote.watchAvailability(avail => {
                    setCastStatus(avail ? 'Cast device found. Tap the button below to choose it.' : 'No Cast device found on this Wi-Fi.\n' + CAST_HELP);
                }).then(id => { castWatchId = id; }).catch(() => setCastStatus('Device scan is not available here.\n' + CAST_HELP));
                return;
            }
            setCastStatus('This app cannot scan for Cast devices directly.\n' + CAST_HELP);
        }

        function openCastModal() {
            closeAllDropdowns();
            document.getElementById('castModal')?.classList.add('show');
            updateCastStatus();
            if (window.lucide) lucide.createIcons();
        }

        function closeCastModal() {
            document.getElementById('castModal')?.classList.remove('show');
            if (castWatchId !== null) { try { audioElement.remote.cancelWatchAvailability(castWatchId); } catch (_) {} castWatchId = null; }
        }

        async function triggerNativeRemoteCastPrompt() {
            try {
                if (window.Android && typeof window.Android.openCast === 'function') { window.Android.openCast(); return; }
                if (audioElement.remote && typeof audioElement.remote.prompt === 'function') {
                    await audioElement.remote.prompt();
                    showToast('Casting to TV');
                    closeCastModal();
                    return;
                }
                setCastStatus('This app cannot scan for Cast devices directly.\n' + CAST_HELP);
            } catch (err) {
                if (err && err.name === 'NotFoundError') setCastStatus('No Cast device found on this Wi-Fi.\n' + CAST_HELP);
                else if (err && err.name === 'AbortError') { /* user closed the picker */ }
                else setCastStatus(CAST_HELP);
            }
        }

