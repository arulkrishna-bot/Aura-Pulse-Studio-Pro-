        function renderAlbumsAndArtists() {
            const albDeck = document.getElementById('albumsContainerDeck');
            const artDeck = document.getElementById('artistsContainerDeck');
            if (!albDeck || !artDeck) return;
            if (state.playlist.length === 0) return;

            const albumCounts = new Map();
            const albumSamples = new Map();
            const artistCounts = new Map();
            const artistSamples = new Map();
            state.playlist.forEach(song => {
                const album = song.album || "Unknown Album";
                const artist = song.artist || "Unknown Artist";
                albumCounts.set(album, (albumCounts.get(album) || 0) + 1);
                artistCounts.set(artist, (artistCounts.get(artist) || 0) + 1);
                if (!albumSamples.has(album)) albumSamples.set(album, song);
                if (!artistSamples.has(artist)) artistSamples.set(artist, song);
            });
            const uniqueAlbums = [...albumCounts.keys()].slice(0, 100);
            albDeck.className = (state.albumViewMode === 'grid') ? "two-column-grid" : "media-list-deck";
            albDeck.innerHTML = uniqueAlbums.map(alb => {
                const sampleSong = albumSamples.get(alb);
                const albumArt = sampleSong?.cover || DEFAULT_ART;
                const count = albumCounts.get(alb);
                return `
                    <div class="grid-media-card" onclick="filterByAlbum(decodeURIComponent('${encodeURIComponent(alb).replace(/'/g,'%27')}'))">
                        <img class="grid-album-thumb" src="${albumArt}" alt="art" loading="lazy">
                        <div class="grid-title-text">${escapeHtml(alb)}</div>
                        <div class="grid-sub-text">${count} Songs</div>
                    </div>
                `;
            }).join('');

            const uniqueArtists = [...artistCounts.keys()].slice(0, 100);
            artDeck.className = (state.artistViewMode === 'grid') ? "two-column-grid" : "media-list-deck";
            artDeck.innerHTML = uniqueArtists.map(art => {
                const sampleSong = artistSamples.get(art);
                const artistArt = sampleSong?.cover || DEFAULT_ART;
                const count = artistCounts.get(art);
                return `
                    <div class="grid-media-card" style="align-items: center; text-align: center;" onclick="filterByArtist(decodeURIComponent('${encodeURIComponent(art).replace(/'/g,'%27')}'))">
                        <img class="grid-artist-thumb" src="${artistArt}" alt="art" loading="lazy">
                        <div class="grid-title-text" style="text-align: center;">${escapeHtml(art)}</div>
                        <div class="grid-sub-text" style="text-align: center;">${count} Tracks</div>
                    </div>
                `;
            }).join('');
            if (window.lucide) lucide.createIcons();
        }

        function filterByAlbum(alb) {
            state.songsScope = { type: 'album', value: alb, label: alb };
            resetSongsSearchBox();
            navigateTo('viewSongs');
        }

        function filterByArtist(art) {
            state.songsScope = { type: 'artist', value: art, label: art };
            resetSongsSearchBox();
            navigateTo('viewSongs');
        }

        function playSongById(id, queueIds) {
            state.queueIds = Array.isArray(queueIds) ? queueIds : null;
            const index = state.playlist.findIndex(s => s.id === id);
            if (index !== -1) playSongByIndex(index);
        }

        async function getOrPreloadTrackUrl(song) {
            if (!song) return null;
            if (song.cachedUrl) return song.cachedUrl;
            if (activeUrlCache.has(song.id)) return activeUrlCache.get(song.id);
            if (song.audioBlob) {
                const url = URL.createObjectURL(song.audioBlob);
                song.cachedUrl = url;
                activeUrlCache.set(song.id, url);
                return url;
            }
            const blob = await getTrackBlob(song.id);
            if (blob) {
                song.audioBlob = blob;
                const url = URL.createObjectURL(blob);
                song.cachedUrl = url;
                activeUrlCache.set(song.id, url);
                return url;
            }
            return null;
        }

        function preloadAdjacentTracks(idx) {
            if (!state.playlist || state.playlist.length === 0) return;
            const nextIdx = (idx + 1) % state.playlist.length;
            const prevIdx = (idx - 1 + state.playlist.length) % state.playlist.length;
            if (state.playlist[nextIdx]) getOrPreloadTrackUrl(state.playlist[nextIdx]);
            if (state.playlist[prevIdx]) getOrPreloadTrackUrl(state.playlist[prevIdx]);
        }

        let playbackRequestToken = 0;
        const AURA_PLAYER_SESSION_KEY = "aura_player_session_v2";
        let lastSessionSaveAt = 0;
        let pendingSessionRestore = null;

        function savePlayerSession(force = false) {
            const now = Date.now();
            if (!force && now - lastSessionSaveAt < 2500) return;
            lastSessionSaveAt = now;
            try {
                const song = state.playlist[state.currentIndex];
                const session = { songId: song?.id ?? null, currentTime: Number.isFinite(state.simulatedSec) ? state.simulatedSec : 0, wasPlaying: !!state.isPlaying, currentView: state.currentView || "viewHome", savedAt: now, shuffle: !!state.isShuffle, repeat: !!state.isRepeat };
                localStorage.setItem(AURA_PLAYER_SESSION_KEY, JSON.stringify(session));
            } catch (_) {}
        }

        function restorePlayerSession(tracks) {
            let saved;
            try { saved = JSON.parse(localStorage.getItem(AURA_PLAYER_SESSION_KEY) || "null"); } catch (_) { saved = null; }
            if (!saved || !tracks?.length) return;
            const index = tracks.findIndex(track => String(track.id) === String(saved.songId));
            if (index < 0) return;
            state.currentIndex = index;
            state.isShuffle = !!saved.shuffle;
            state.isRepeat = !!saved.repeat;
            state.isPlaying = !!saved.wasPlaying;
            const song = tracks[index];
            const cover = song.cover || DEFAULT_ART;
            ["playerMainTitle", "miniPlayerTitle"].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = song.title || "Unknown Track"; });
            ["playerMainArtist", "miniPlayerArtist"].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = song.artist || "Unknown Artist"; });
            ["playerCoverImg", "dockedMiniThumb"].forEach(id => { const el = document.getElementById(id); if (el) el.src = cover; });
            const dur = document.getElementById("labelDurationTime"); if (dur) dur.textContent = song.duration || "0:00";
            const resumeAt = Math.max(0, Number(saved.currentTime) || 0);
            pendingSessionRestore = { songId: song.id, currentTime: resumeAt, wasPlaying: !!saved.wasPlaying };
            state.simulatedSec = resumeAt;
            state.parsedLyrics = song.syncedLyrics ? parseLrcString(song.syncedLyrics) : [];
            renderLyricsLines(); updateTrackProgress(resumeAt, song.durationSec); updatePlaybackStateIcons();
            if (saved.currentView && document.getElementById(saved.currentView)) navigateTo(saved.currentView);
            getOrPreloadTrackUrl(song).then(src => {
                if (!src || !pendingSessionRestore || String(pendingSessionRestore.songId) !== String(song.id)) return;
                audioElement.src = src; audioElement.load();
                const restorePosition = () => {
                    const pending = pendingSessionRestore; if (!pending || String(pending.songId) !== String(song.id)) return;
                    try { if (Number.isFinite(audioElement.duration) && audioElement.duration > 0) audioElement.currentTime = Math.min(pending.currentTime, Math.max(0, audioElement.duration - 0.25)); else audioElement.currentTime = pending.currentTime; } catch (_) {}
                    state.simulatedSec = audioElement.currentTime || pending.currentTime; updateTrackProgress(state.simulatedSec, audioElement.duration);
                    pendingSessionRestore = null;
                    if (saved.wasPlaying) { state.isPlaying = true; updatePlaybackStateIcons(); audioElement.play().catch(() => { state.isPlaying = false; updatePlaybackStateIcons(); savePlayerSession(true); }); }
                    else { state.isPlaying = false; updatePlaybackStateIcons(); }
                    updateMediaSession(song); fetchLiveLyricsForCurrentTrack(); savePlayerSession(true);
                };
                if (audioElement.readyState >= 1) restorePosition(); else audioElement.addEventListener("loadedmetadata", restorePosition, { once: true });
            }).catch(() => {});
        }

        window.addEventListener("pagehide", () => savePlayerSession(true));
        document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") savePlayerSession(true); });

        async function playSongByIndex(idx) {
            if (!state.playlist || state.playlist.length === 0) return;
            const requestToken = ++playbackRequestToken;
            lyricsRequestToken++;
            if (lyricsFetchTimeout) clearTimeout(lyricsFetchTimeout);
            state.parsedLyrics = [];
            lastActiveLyricIndex = -1;
            const lyricWrap = document.getElementById('lyricsLinesWrap');
            if (lyricWrap) lyricWrap.style.transform = 'translate3d(0,0,0)';
            renderLyricsLines();
            state.currentIndex = idx;
            const song = state.playlist[idx];
            if (!song) return;

            const coverSrc = song.cover || DEFAULT_ART;
            cachedPipCoverImg.src = coverSrc;

            document.getElementById('playerMainTitle').textContent = song.title;
            document.getElementById('playerMainArtist').textContent = song.artist;
            document.getElementById('playerCoverImg').src = coverSrc;
            
            document.getElementById('miniPlayerTitle').textContent = song.title;
            document.getElementById('miniPlayerArtist').textContent = song.artist;
            document.getElementById('dockedMiniThumb').src = coverSrc;
            document.getElementById('labelDurationTime').textContent = song.duration || "0:00";

            state.simulatedSec = 0;
            lastActiveLyricIndex = -1;
            savePlayerSession(true);
            document.getElementById('labelCurrentTime').textContent = "0:00";
            document.getElementById('studioSeekFill').style.width = '0%';
            document.getElementById('dockedMiniFill').style.width = '0%';

            updateActiveSongRowHighlight(song.id);
            updateFavoriteBtnIcon();
            updateAmbientCover();

            const audioSrc = await getOrPreloadTrackUrl(song);
            if (requestToken !== playbackRequestToken || state.playlist[state.currentIndex]?.id !== song.id) return;

            if (audioSrc) {
                try {
                    audioElement.pause();
                    if (audioElement.src !== audioSrc) audioElement.src = audioSrc;
                    else audioElement.currentTime = 0;
                    audioElement.load();
                    state.isPlaying = true;
                    updatePlaybackStateIcons();

                    // Initialize AudioContext on user-directed playback
                    initWebAudioVisualizer();

                    audioElement.play().catch(() => {
                        state.isPlaying = false;
                        updatePlaybackStateIcons();
                    });
                } catch (e) {
                    state.isPlaying = false;
                    updatePlaybackStateIcons();
                }
            }
            preloadAdjacentTracks(idx);
            fetchLiveLyricsForCurrentTrack();
        }

        function playAudio() {
            if (state.playlist.length === 0) {
                document.getElementById('audioFileInput').click();
                return;
            }
            state.isPlaying = true;
            updatePlaybackStateIcons();
            initWebAudioVisualizer();
            if (audioElement.src) audioElement.play().catch(() => {});
        }

        function pauseAudio() {
            if (audioElement.src) audioElement.pause();
            state.isPlaying = false;
            updatePlaybackStateIcons();
        }

        function togglePlayState() {
            if (state.isPlaying) pauseAudio();
            else playAudio();
        }

        /* Next / previous stay inside the list the song was started from (album, artist, playlist...). */
        function getPlayQueueIndices() {
            const cur = state.playlist[state.currentIndex];
            if (Array.isArray(state.queueIds) && cur && state.queueIds.includes(cur.id)) {
                const idx = state.queueIds.map(id => state.playlist.findIndex(s => s.id === id)).filter(i => i >= 0);
                if (idx.length) return idx;
            }
            return state.playlist.map((_, i) => i);
        }

        function playNextSong() {
            if (state.playlist.length === 0) return;
            const q = getPlayQueueIndices();
            const pos = q.indexOf(state.currentIndex);
            let nextIndex = q[(pos + 1) % q.length];
            if (state.isShuffle) nextIndex = q[Math.floor(Math.random() * q.length)];
            playSongByIndex(nextIndex);
        }

        function playPreviousSong() {
            if (state.playlist.length === 0) return;
            const q = getPlayQueueIndices();
            const pos = q.indexOf(state.currentIndex);
            const prevIndex = q[(pos - 1 + q.length) % q.length];
            playSongByIndex(prevIndex);
        }

        function toggleShuffle() {
            state.isShuffle = !state.isShuffle;
            document.getElementById('btnShuffle')?.classList.toggle('active', state.isShuffle);
        }

        function toggleRepeat() {
            state.isRepeat = !state.isRepeat;
            document.getElementById('btnRepeat')?.classList.toggle('active', state.isRepeat);
        }

        function updatePlaybackStateIcons() {
            const masterBtn = document.getElementById('masterPlayKnob');
            const miniBtn = document.getElementById('miniPlayBtn');
            const iconHtml = state.isPlaying 
                ? '<i data-lucide="pause" style="width: 24px; height: 24px; fill: currentColor;"></i>'
                : '<i data-lucide="play" style="width: 24px; height: 24px; fill: currentColor;"></i>';
            if (masterBtn) masterBtn.innerHTML = iconHtml;
            if (miniBtn) miniBtn.innerHTML = state.isPlaying
                ? '<i data-lucide="pause" style="width: 17px; height: 17px; fill: currentColor;"></i>'
                : '<i data-lucide="play" style="width: 17px; height: 17px; fill: currentColor;"></i>';
            if (window.lucide) lucide.createIcons();
        }

        function seekTrackPos(e) {
            const song = state.playlist[state.currentIndex];
            if (!song) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            const targetSec = pos * (song.durationSec || 1);
            if (audioElement.src && !isNaN(audioElement.duration)) {
                audioElement.currentTime = targetSec;
            } else {
                updateTrackProgress(targetSec, song.durationSec || 200);
            }
        }

        function formatSeconds(sec) {
            if (isNaN(sec) || sec < 0) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function toggleAppearanceMode() {
            const root = document.getElementById('appShell');
            const next = (root?.getAttribute('data-mode') || localStorage.getItem('aura_appearance_mode') || 'day') === 'day' ? 'night' : 'day';
            applyAppearanceMode(next);
        }

        // Horizontal touch/mouse drag support for the 3D rocker. A drag selects the side released on.
        (function setupAppearanceSwitchDrag() {
            const btn = document.getElementById('appearanceModeSwitch');
            if (!btn || btn.dataset.dragReady === 'true') return;
            btn.dataset.dragReady = 'true';
            let startX = 0, startY = 0, dragging = false, didDrag = false;
            btn.addEventListener('pointerdown', (e) => {
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                startX = e.clientX; startY = e.clientY; dragging = true; didDrag = false;
            });
            btn.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                if (Math.abs(e.clientX - startX) > 7 && Math.abs(e.clientX - startX) > Math.abs(e.clientY - startY)) didDrag = true;
            });
            btn.addEventListener('pointerup', (e) => {
                if (!dragging) return;
                dragging = false;
                const dx = e.clientX - startX;
                if (Math.abs(dx) > 18 && Math.abs(dx) > Math.abs(e.clientY - startY)) {
                    didDrag = true;
                    applyAppearanceMode(dx > 0 ? 'night' : 'day');
                    btn.dataset.suppressClick = 'true';
                    setTimeout(() => { delete btn.dataset.suppressClick; }, 0);
                }
            });
            btn.addEventListener('pointercancel', () => { dragging = false; });
            btn.addEventListener('click', (e) => {
                if (btn.dataset.suppressClick === 'true') { e.preventDefault(); e.stopImmediatePropagation(); delete btn.dataset.suppressClick; }
            }, true);
            btn.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'Home') { e.preventDefault(); applyAppearanceMode('day'); }
                else if (e.key === 'ArrowRight' || e.key === 'End') { e.preventDefault(); applyAppearanceMode('night'); }
            });
        })();

        function auraHexToHsl(hex) {
            const n = parseInt(hex.slice(1), 16);
            const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
            let h = 0, s = 0; const l = (max + min) / 2;
            if (d) {
                s = d / (1 - Math.abs(2 * l - 1));
                if (max === r) h = ((g - b) / d) % 6; else if (max === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
                h = (h * 60 + 360) % 360;
            }
            return [h, s, l];
        }
        function auraHsl(h, s, l) { return `hsl(${Math.round(h)}, ${Math.round(s * 100)}%, ${Math.round(l * 100)}%)`; }
        const AURA_DAY_BASE = { light:'#eaf0f8', slate:'#202a35', mint:'#e0fffb', mint3d:'#dcfff5', violet3d:'#eee7ff', skysmile:'#e5f5ff', blushrose:'#fff0f4', sunnyhoney:'#fff5d9', seafoam:'#dcefe3', peach:'#fff0e6' };
        const AURA_THEME_VARS = ['--bg-base','--bg-surface','--bg-card','--shadow-light','--shadow-dark','--shadow-darker','--text-heading','--text-body','--text-dim'];

        /* Night mode = the theme's own Day colour, made deeper (same hue, soft tinted shadows, no black/neon glow). */
        function applyAppearanceMode(mode) {
            const root = document.getElementById('appShell');
            if (!root) return;
            mode = mode === 'night' ? 'night' : 'day';
            const theme = root.getAttribute('data-theme') || 'slate';
            const accentBase = /^#[0-9a-f]{6}$/i.test(state.currentAccent || '') ? state.currentAccent : '#22d3ee';
            let customPal = {};
            if (theme === 'custom') { try { customPal = JSON.parse(localStorage.getItem('aura_custom_theme_colors') || '{}'); } catch (_) {} }

            if (mode === 'day') {
                root.setAttribute('data-mode', 'day');
                AURA_THEME_VARS.forEach(v => root.style.removeProperty(v));
                if (theme === 'custom') {
                    const bg = /^#[0-9a-f]{6}$/i.test(customPal.bg || '') ? customPal.bg : '#eaf0f8';
                    const card = /^#[0-9a-f]{6}$/i.test(customPal.card || '') ? customPal.card : '#e3ebf6';
                    root.style.setProperty('--bg-base', bg); root.style.setProperty('--bg-surface', `color-mix(in srgb, ${bg} 72%, white)`);
                    root.style.setProperty('--bg-card', card); root.style.setProperty('--shadow-light', `color-mix(in srgb, ${card} 70%, white)`);
                    root.style.setProperty('--shadow-dark', `color-mix(in srgb, ${card} 76%, black)`); root.style.setProperty('--shadow-darker', `color-mix(in srgb, ${card} 62%, black)`);
                }
                root.style.setProperty('--accent-coral', accentBase);
            } else {
                let dayBase = AURA_DAY_BASE[theme] || '#eaf0f8';
                if (theme === 'custom' && /^#[0-9a-f]{6}$/i.test(customPal.bg || '')) dayBase = customPal.bg;
                const [h, s, l] = auraHexToHsl(dayBase);
                const dark = l < 0.4;
                const sat = dark ? Math.min(s, 0.30) : Math.min(0.46, Math.max(0.24, s * 0.5));
                const bL = dark ? Math.max(0.10, l * 0.85) : 0.21;
                const set = (k, v) => root.style.setProperty(k, v);
                set('--bg-base', auraHsl(h, sat, bL));
                set('--bg-surface', auraHsl(h, sat, bL + 0.05));
                set('--bg-card', auraHsl(h, sat, Math.max(0.07, bL - 0.04)));
                set('--shadow-light', auraHsl(h, sat, bL + 0.075));
                set('--shadow-dark', auraHsl(h, sat, Math.max(0.05, bL - 0.10)));
                set('--shadow-darker', auraHsl(h, sat * 0.9, Math.max(0.03, bL - 0.14)));
                set('--text-heading', auraHsl(h, Math.min(0.6, sat + 0.1), 0.95));
                set('--text-body', auraHsl(h, Math.min(0.35, sat), 0.82));
                set('--text-dim', auraHsl(h, Math.min(0.2, sat), 0.64));
                // Lift the accent a little so it stays readable on the deeper background.
                const [ah, as, al] = auraHexToHsl(accentBase);
                if (al < 0.6) set('--accent-coral', auraHsl(ah, as, 0.62)); else set('--accent-coral', accentBase);
                root.setAttribute('data-mode', 'night');
            }
            localStorage.setItem('aura_appearance_mode', mode);
            const btn = document.getElementById('appearanceModeSwitch');
            if (btn) {
                btn.setAttribute('aria-checked', mode === 'night' ? 'true' : 'false');
                btn.setAttribute('aria-label', mode === 'night' ? 'Night mode active. Switch to Day mode' : 'Day mode active. Switch to Night mode');
                btn.title = mode === 'night' ? 'Night mode — deeper theme colours' : 'Day mode';
            }
            // Soft glow derived from whatever accent is active now (hsl() or hex).
            const probe = document.createElement('span'); probe.style.color = getComputedStyle(root).getPropertyValue('--accent-coral').trim() || accentBase;
            root.appendChild(probe); const rgb = (getComputedStyle(probe).color.match(/\d+/g) || [34, 211, 238]).slice(0, 3); probe.remove();
            root.style.setProperty('--accent-coral-glow', `rgba(${rgb.join(', ')}, ${mode === 'night' ? '0.16' : '0.14'})`);
            root.style.setProperty('--accent-coral-soft', `rgba(${rgb.join(', ')}, ${mode === 'night' ? '0.14' : '0.09'})`);
        }

        function applyCustomThemeFromPicker() {
            const bg = document.getElementById('customThemeBg')?.value || '#eaf0f8';
            const card = document.getElementById('customThemeCard')?.value || '#e3ebf6';
            const accent = document.getElementById('customThemeAccent')?.value || '#22d3ee';
            const palette = { bg, card, accent };
            localStorage.setItem('aura_custom_theme_colors', JSON.stringify(palette));
            localStorage.setItem('aura_custom_theme_accent', accent);
            localStorage.setItem('aura_custom_accent_glow', accent);
            applySystemTheme('custom');
            showToast('Custom Studio colors applied ✓');
        }

        function applySystemTheme(theme) {
            const validThemes = ['light', 'slate', 'mint', 'mint3d', 'violet3d', 'skysmile', 'blushrose', 'sunnyhoney', 'seafoam', 'peach', 'custom'];
            if (!validThemes.includes(theme)) theme = 'slate';
            state.currentTheme = theme;
            localStorage.setItem("aura_app_theme", theme);
            document.querySelectorAll('.theme-preview-box').forEach(b => b.classList.remove('active'));
            const cardMap = { light:'themeCardLight', slate:'themeCardSlate', mint:'themeCardMint', mint3d:'themeCardMint3d', violet3d:'themeCardViolet3d', skysmile:'themeCardSkysmile', blushrose:'themeCardBlushrose', sunnyhoney:'themeCardSunnyhoney', seafoam:'themeCardSeafoam', peach:'themeCardPeach', custom:'themeCardCustom' };
            document.getElementById(cardMap[theme])?.classList.add('active');
            document.getElementById('appShell').setAttribute('data-theme', theme);
            const themeRoot = document.getElementById('appShell');
            if (theme !== 'custom') ['--bg-base','--bg-surface','--bg-card','--shadow-light','--shadow-dark','--shadow-darker'].forEach(v => themeRoot.style.removeProperty(v));
            if (theme === 'custom') {
                try {
                    const custom = JSON.parse(localStorage.getItem('aura_custom_theme_colors') || '{}');
                    const bg = /^#[0-9a-f]{6}$/i.test(custom.bg || '') ? custom.bg : '#eaf0f8';
                    const card = /^#[0-9a-f]{6}$/i.test(custom.card || '') ? custom.card : '#e3ebf6';
                    const accentColor = /^#[0-9a-f]{6}$/i.test(custom.accent || '') ? custom.accent : '#22d3ee';
                    const root = document.getElementById('appShell');
                    root.style.setProperty('--bg-base', bg); root.style.setProperty('--bg-surface', `color-mix(in srgb, ${bg} 72%, white)`);
                    root.style.setProperty('--bg-card', card); root.style.setProperty('--shadow-light', `color-mix(in srgb, ${card} 70%, white)`);
                    root.style.setProperty('--shadow-dark', `color-mix(in srgb, ${card} 76%, black)`); root.style.setProperty('--shadow-darker', `color-mix(in srgb, ${card} 62%, black)`);
                    root.style.setProperty('--accent-coral', accentColor); root.style.setProperty('--accent-coral-glow', accentColor + '55'); root.style.setProperty('--accent-coral-soft', accentColor + '22');
                } catch (_) {}
            }
            const accents = { light:'#22d3ee', slate:'#22d3ee', mint:'#00a6ad', mint3d:'#00a6ad', violet3d:'#7952d8', skysmile:'#1599d6', blushrose:'#d94f7d', sunnyhoney:'#d99513', seafoam:'#247a4b', peach:'#c66b4b', custom:(localStorage.getItem('aura_custom_theme_accent') || '#22d3ee') };
            const themeAccent = accents[theme];
            /* A user-selected Accent Glow overrides the theme accent; otherwise follow theme. */
            const customAccent = localStorage.getItem('aura_custom_accent_glow');
            const accent = (customAccent && /^#[0-9a-f]{6}$/i.test(customAccent)) ? customAccent : themeAccent;
            state.currentAccent = accent;
            [document.documentElement, document.getElementById('appShell')].filter(Boolean).forEach(root => {
                root.style.setProperty('--accent-coral', accent);
                root.style.setProperty('--accent-coral-glow', accent + '24');
                root.style.setProperty('--accent-coral-soft', accent + '18');
            });
            localStorage.setItem('aura_accent_glow', accent);
            applyAppearanceMode(localStorage.getItem('aura_appearance_mode') || 'day');
            document.querySelectorAll('.accent-dot-btn').forEach(btn => {
                btn.classList.toggle('active', (btn.dataset.accentColor || '').toLowerCase() === accent.toLowerCase());
            });
        }

        function changeFontSizeScale(val) {
            document.documentElement.style.setProperty('--app-font-scale', val);
            localStorage.setItem("aura_font_scale", val);
        }

        /* Personal wallpaper: resize before saving so mobile localStorage limits are less likely to be hit. */
        function setWallpaperOpacity(value) {
            const n = Math.max(8, Math.min(75, Number(value) || 42));
            const root = document.getElementById('appShell');
            if (root) root.style.setProperty('--wallpaper-opacity', (n / 100).toFixed(2));
            const label = document.getElementById('wallpaperOpacityLabel'); if (label) label.textContent = n + '%';
            try { localStorage.setItem('aura_wallpaper_opacity', String(n)); } catch (_) {}
        }
        function renderUserWallpaper(dataUrl) {
            const layer = document.getElementById('userWallpaperLayer');
            const preview = document.getElementById('wallpaperPreview');
            if (layer) { if (dataUrl) { layer.style.backgroundImage = `url("${dataUrl}")`; layer.classList.add('is-active'); document.getElementById('appShell')?.classList.add('has-wallpaper'); } else { layer.style.backgroundImage = 'none'; layer.classList.remove('is-active'); document.getElementById('appShell')?.classList.remove('has-wallpaper'); } }
            if (preview) { preview.style.backgroundImage = dataUrl ? `url("${dataUrl}")` : 'none'; preview.textContent = dataUrl ? '' : 'Wallpaper preview'; }
        }
        async function processWallpaperFile(file) {
            if (!file || !file.type || !file.type.startsWith('image/')) return;
            try {
                const source = await new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsDataURL(file); });
                const img = await new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = reject; i.src = source; });
                const maxSide = 1200, scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
                const canvas = document.createElement('canvas'); canvas.width = Math.max(1, Math.round(img.naturalWidth * scale)); canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
                const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                let dataUrl = canvas.toDataURL('image/jpeg', 0.66);
                try { localStorage.setItem('aura_user_wallpaper', dataUrl); }
                catch (storageError) { dataUrl = canvas.toDataURL('image/jpeg', 0.38); localStorage.setItem('aura_user_wallpaper', dataUrl); }
                renderUserWallpaper(dataUrl); showToast('Wallpaper applied ✓');
            } catch (err) { showToast('Could not save this image. Please choose a smaller image.'); }
        }
        function clearUserWallpaper() {
            localStorage.removeItem('aura_user_wallpaper'); renderUserWallpaper('');
            const input = document.getElementById('wallpaperFileInput'); if (input) input.value = '';
            showToast('Wallpaper removed');
        }
        document.getElementById('wallpaperFileInput')?.addEventListener('change', e => { const file = e.target.files && e.target.files[0]; if (file) processWallpaperFile(file); });

        /* FILE IMPORT & EMBEDDED METADATA PARSING */
        document.getElementById('audioFileInput').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;
            showToast(`Adding ${files.length} songs...`);

            const newSongs = [];
            const timestamp = Date.now();

            for (let i = 0; i < files.length; i++) {
                const f = files[i];
                const cleanName = f.name.replace(/\.[^/.]+$/, "");
                const trackItem = {
                    id: timestamp + i,
                    title: cleanName,
                    artist: "Local Track",
                    album: "Offline Audio",
                    duration: "3:30",
                    durationSec: 210,
                    cover: DEFAULT_ART,
                    genre: "Soundtrack",
                    year: "2024",
                    audioBlob: f
                };
                newSongs.push(trackItem);
            }

            state.playlist = [...newSongs, ...state.playlist];
            state.displayedPlaylist = [...state.playlist];
            renderTrackList();
            navigateTo('viewSongs');

            let queueIndex = 0;
            function processNextFile() {
                if (queueIndex >= newSongs.length) return;
                const songObj = newSongs[queueIndex++];
                readEmbeddedMetadata(songObj.audioBlob, songObj).then(() => {
                    saveTrackMeta(songObj);
                    saveTrackBlob(songObj.id, songObj.audioBlob);
                    if (window.requestIdleCallback) requestIdleCallback(processNextFile);
                    else setTimeout(processNextFile, 30);
                });
            }
            processNextFile();
        });

        function readEmbeddedMetadata(file, songObj) {
            return new Promise((resolve) => {
                if (window.jsmediatags) {
                    try {
                        window.jsmediatags.read(file, {
                            onSuccess: function(tag) {
                                const tags = tag.tags;
                                if (tags.title) songObj.title = tags.title;
                                if (tags.artist) songObj.artist = tags.artist;
                                if (tags.album) songObj.album = tags.album;
                                if (tags.genre) songObj.genre = tags.genre;
                                if (tags.year) songObj.year = tags.year;
                                if (tags.picture) {
                                    const { data, format } = tags.picture;
                                    let base64String = "";
                                    for (let i = 0; i < data.length; i++) base64String += String.fromCharCode(data[i]);
                                    songObj.cover = `data:${format};base64,${window.btoa(base64String)}`;
                                }
                                resolve();
                            },
                            onError: () => resolve()
                        });
                    } catch(err) { resolve(); }
                } else { resolve(); }
            });
        }

        function handleSearchInput(val) {
            const clearBtn = document.getElementById('searchClearBtn');
            const searchDeck = document.getElementById('searchResultsDeck');
            const discoveryHub = document.getElementById('searchDiscoveryHub');

            if (!val || !val.trim()) {
                if (clearBtn) clearBtn.style.display = 'none';
                if (searchDeck) searchDeck.style.display = 'none';
                if (discoveryHub) discoveryHub.style.display = 'block';
                return;
            }
            if (clearBtn) clearBtn.style.display = 'flex';
            if (discoveryHub) discoveryHub.style.display = 'none';
            if (searchDeck) searchDeck.style.display = 'block';

            const q = val.toLowerCase().trim();
            const results = state.playlist.filter(s => s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q) || (s.album && s.album.toLowerCase().includes(q)));
            searchDeck.innerHTML = results.map(song => `
                <div class="song-tile-row" onclick="playSongById(${song.id})">
                    <div class="song-tile-left">
                        <img class="song-tile-thumb" src="${song.cover || DEFAULT_ART}" alt="cover" loading="lazy">
                        <div class="song-tile-meta">
                            <div class="song-tile-title">${escapeHtml(song.title)}</div>
                            <div class="song-tile-artist">${escapeHtml(song.artist)} • ${escapeHtml(song.album || "")}</div>
                        </div>
                    </div>
                    <button class="neu-btn btn-circle-32">
                        <i data-lucide="play" style="width: 13px; height: 13px; fill: currentColor; color: var(--accent-coral);"></i>
                    </button>
                </div>
            `).join('');
            if (window.lucide) lucide.createIcons();
        }

