        /* ROTARY KNOB DIALS */
        function cycleKnobVal(type) {
            if (type === 'bass') {
                state.bassKnobVal = (state.bassKnobVal + 3) % 15;
                const deg = (state.bassKnobVal / 12) * 270 - 135;
                document.getElementById('dialBassKnob').style.transform = `rotate(${deg}deg)`;
                document.getElementById('dialBassValText').textContent = `+${state.bassKnobVal} dB`;
                showToast(`Bass Boost: +${state.bassKnobVal} dB`);
            } else if (type === 'virtual') {
                state.virtualKnobVal = (state.virtualKnobVal + 25) % 125;
                if (state.virtualKnobVal === 0) state.virtualKnobVal = 25;
                const deg = (state.virtualKnobVal / 100) * 270 - 135;
                document.getElementById('dialVirtualKnob').style.transform = `rotate(${deg}deg)`;
                document.getElementById('dialVirtualValText').textContent = `${state.virtualKnobVal}%`;
                showToast(`Virtualizer: ${state.virtualKnobVal}%`);
            }
        }

