    <style>
        :root {
            /* 1. Light Clay Neumorphism (Default) */
            --bg-base: #eaf0f8;
            --bg-surface: #edf3fa;
            --bg-card: #e3ebf6;
            --shadow-light: #ffffff;
            --shadow-dark: #c5d2e3;
            --shadow-darker: #b0c0d6;

            /* Luxury Accent Defaults (Dynamic Coral) */
            --accent-coral: #22d3ee;
            --accent-coral-glow: rgba(34, 211, 238, 0.35);
            --accent-coral-soft: rgba(34, 211, 238, 0.12);

            --text-heading: #242f40;
            --text-body: #4e5d73;
            --text-dim: #7f8fa4;

            /* GPU-Optimized 3D Neumorphic Shadows */
            --neu-flat: 5px 5px 12px var(--shadow-dark), -5px -5px 12px var(--shadow-light);
            --neu-flat-sm: 4px 4px 9px var(--shadow-dark), -4px -4px 9px var(--shadow-light);
            --neu-flat-xs: 2px 2px 5px var(--shadow-dark), -2px -2px 5px var(--shadow-light);
            --neu-pressed: inset 2px 2px 5px var(--shadow-darker), inset -2px -2px 5px var(--shadow-light);
            --neu-card-recessed: inset 3px 3px 8px var(--shadow-darker), inset -3px -3px 8px var(--shadow-light);

            /* Typography & Layout */
            --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --app-font-scale: 1;
            --app-radius: 36px;
        }

        /* 2. Velvet Matte Slate Dark */
        [data-theme="dark"] {
            --bg-base: #2a2e35;
            --bg-surface: #2d323a;
            --bg-card: #25282f;
            --shadow-light: #343b44;
            --shadow-dark: #1b1e23;
            --shadow-darker: #14161a;
            --text-heading: #f1f5f9;
            --text-body: #cbd5e1;
            --text-dim: #8b99ac;
            --accent-coral-soft: rgba(255, 82, 64, 0.18);
            --neu-flat: 5px 5px 12px var(--shadow-dark), -5px -5px 12px var(--shadow-light);
            --neu-flat-sm: 4px 4px 9px var(--shadow-dark), -4px -4px 9px var(--shadow-light);
            --neu-flat-xs: 2px 2px 5px var(--shadow-dark), -2px -2px 5px var(--shadow-light);
            --neu-pressed: inset 2px 2px 5px var(--shadow-darker), inset -2px -2px 5px var(--shadow-light);
            --neu-card-recessed: inset 3px 3px 8px var(--shadow-darker), inset -3px -3px 8px var(--shadow-light);
        }

        /* 4. Studio Midnight Stealth Black */
        [data-theme="midnight"] {
            --bg-base: #14161b;
            --bg-surface: #181b22;
            --bg-card: #101216;
            --shadow-light: #1e222a;
            --shadow-dark: #0a0b0d;
            --shadow-darker: #050607;
            --text-heading: #f8fafc;
            --text-body: #94a3b8;
            --text-dim: #64748b;
            --accent-coral-soft: rgba(255, 82, 64, 0.18);
            --neu-flat: 5px 5px 11px var(--shadow-dark), -5px -5px 11px var(--shadow-light);
            --neu-flat-sm: 3px 3px 7px var(--shadow-dark), -3px -3px 7px var(--shadow-light);
            --neu-flat-xs: 2px 2px 4px var(--shadow-dark), -2px -2px 4px var(--shadow-light);
            --neu-pressed: inset 2px 2px 5px var(--shadow-darker), inset -2px -2px 5px var(--shadow-light);
            --neu-card-recessed: inset 3px 3px 7px var(--shadow-darker), inset -3px -3px 7px var(--shadow-light);
        }

        /* Restored original White / Light Clay theme (kept alongside the 7 new themes). */
        [data-theme="light"] {
            --bg-base:#eaf0f8; --bg-surface:#edf3fa; --bg-card:#e3ebf6;
            --shadow-light:#ffffff; --shadow-dark:#c5d2e3; --shadow-darker:#b0c0d6;
            --text-heading:#242f40; --text-body:#4e5d73; --text-dim:#7f8fa4;
            --accent-coral:#22d3ee; --accent-coral-glow:rgba(34,211,238,.35); --accent-coral-soft:rgba(34,211,238,.12);
            --neu-flat:5px 5px 12px var(--shadow-dark),-5px -5px 12px var(--shadow-light);
            --neu-flat-sm:4px 4px 9px var(--shadow-dark),-4px -4px 9px var(--shadow-light);
            --neu-flat-xs:2px 2px 5px var(--shadow-dark),-2px -2px 5px var(--shadow-light);
            --neu-pressed:inset 2px 2px 5px var(--shadow-darker),inset -2px -2px 5px var(--shadow-light);
            --neu-card-recessed:inset 3px 3px 8px var(--shadow-darker),inset -3px -3px 8px var(--shadow-light);
        }

        /* AuraPulse Studio Pro — seven appearance-only palettes. Layout and controls stay unchanged. */
        [data-theme="slate"] {
            --bg-base:#202a35; --bg-surface:#253240; --bg-card:#1b2530;
            --shadow-light:#2c3a49; --shadow-dark:#141c24; --shadow-darker:#10171e;
            --text-heading:#f3fbff; --text-body:#c2d3df; --text-dim:#8ca4b5;
            --accent-coral:#22d3ee; --accent-coral-glow:rgba(34,211,238,.38); --accent-coral-soft:rgba(34,211,238,.14);
            --neu-flat:5px 5px 12px var(--shadow-dark),-5px -5px 12px var(--shadow-light);
            --neu-flat-sm:4px 4px 9px var(--shadow-dark),-4px -4px 9px var(--shadow-light);
            --neu-flat-xs:2px 2px 5px var(--shadow-dark),-2px -2px 5px var(--shadow-light);
            --neu-pressed:inset 2px 2px 5px var(--shadow-darker),inset -2px -2px 5px var(--shadow-light);
            --neu-card-recessed:inset 3px 3px 8px var(--shadow-darker),inset -3px -3px 8px var(--shadow-light);
        }
        [data-theme="mint"] {
            /* Original Mint Aqua palette. */
            --bg-base:#e0fffb; --bg-surface:#f2fffd; --bg-card:#d1f7f1;
            --shadow-light:#ffffff; --shadow-dark:#a9ded7; --shadow-darker:#91cfc6;
            --text-heading:#123f43; --text-body:#356b6d; --text-dim:#67999a;
            --accent-coral:#00a6ad; --accent-coral-glow:rgba(0,166,173,.34); --accent-coral-soft:rgba(0,166,173,.14);
            --neu-flat:5px 5px 12px var(--shadow-dark),-5px -5px 12px var(--shadow-light);
            --neu-flat-sm:4px 4px 9px var(--shadow-dark),-4px -4px 9px var(--shadow-light);
            --neu-flat-xs:2px 2px 5px var(--shadow-dark),-2px -2px 5px var(--shadow-light);
            --neu-pressed:inset 2px 2px 5px var(--shadow-darker),inset -2px -2px 5px var(--shadow-light);
            --neu-card-recessed:inset 3px 3px 8px var(--shadow-darker),inset -3px -3px 8px var(--shadow-light);
        }

        /* AuraPulse 3D themes — accessible contrast with soft, tactile neumorphic depth. */
        [data-theme="mint3d"] {
            --bg-base:#dcfff5; --bg-surface:#f1fffa; --bg-card:#c9f4e5;
